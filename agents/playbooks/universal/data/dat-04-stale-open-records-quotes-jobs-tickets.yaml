  - key: dedupe_window
    description: The key items are collapsed on and the window over which repeats join an existing entry
      rather than opening a new one.
    resolved_by: vertical
  - key: age_thresholds
    description: The age at which each record type and stage becomes stale, and the value band that
      changes the threshold.
    resolved_by: vertical
    required: true
  - key: close_or_chase_policy
    description: Which stale records may be proposed for close-out, which must be chased, how many chases
      run and who signs a close-out off.
