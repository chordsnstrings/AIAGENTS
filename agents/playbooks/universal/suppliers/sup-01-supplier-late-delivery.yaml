    criterion: Chase sent
    evidence: scheduled message log with delivery status
  - id: SUP-01-AC2
    criterion: Impact list
    evidence: named artefact stored against the record
  - id: SUP-01-AC3
    criterion: Jobs recascaded
    evidence: named artefact stored against the record
  - id: SUP-01-AC4
    criterion: Alternates quoted
    evidence: issued document with its price-book references
  - id: SUP-01-AC5
