  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: exception_signal_sources
    description: Queues, feeds, systems and inboxes this unit watches, with the polling interval and
      the field that carries each item's timestamp.
    resolved_by: owner
    required: true
  - key: triage_rules
    description: 'The deterministic rules that classify an item: the condition each one tests, the category
      it assigns and the rule id it is cited by.'
    resolved_by: vertical
    required: true
  - key: severity_matrix
    description: Severity bands, and for each band the response clock, the recipient and the out-of-hours
      behaviour it demands.
    resolved_by: owner
    required: true
  - key: suppression_rules
    description: The only conditions under which an item may be held back from a human, and the evidence
      each one requires before it applies.
    resolved_by: owner
    required: true
  - key: routing_table
    description: Which desk, role or queue receives each category and severity, the default desk for
      anything unmatched, and the on-call fallback.
    resolved_by: owner
    required: true
  - key: dedupe_window
    description: The key items are collapsed on and the window over which repeats join an existing entry
      rather than opening a new one.
    resolved_by: vertical
  - key: cascade_map
    description: Which records depend on which commitment, and how many hops downstream the trace runs
      for this vertical.
    resolved_by: vertical
    required: true
  - key: alternate_sources
    description: Approved alternates, substitutes and reroutes in preference order, with the authority
      each one needs before it is used.
    resolved_by: owner
    required: true
  - key: payment_rails
    description: Payment rails available in this market.
    resolved_by: country_pack
  - key: published_price_book
    description: The only source of money figures this unit may quote.
    resolved_by: owner
    required: true
kpis:
  - share of queue volume closed without reaching a person
  - suppressed items a human later re-opened
  - time from signal to the item being in front of the right person
  - surfaced items breaching their response clock
  - duplicate entries in the surfaced queue
  - affected parties told before they asked
  - affected records re-planned in the same cycle as the break
  - exposure quantified per affected record
