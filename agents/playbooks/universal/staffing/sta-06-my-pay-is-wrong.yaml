id: STA-06
version: 1
kind: playbook
type: playbook_universal
display_name: STA-06 'My pay is wrong'
trigger: '''My pay is wrong'''
scope:
  domain:
    id: DOM-02
    name: Staffing
engine:
  mechanism_family: MF8
  profile: pay_variance_resolution
  config:
    profile: pay_variance_resolution
    profile_summary: Pay and time rebuilt line by line from the source records, so the variance is explained
      with evidence before it hardens into a grievance -- and any correction beyond the rules is adjudicated.
