function: Variance explained line-by-line from records before it becomes a grievance
mission: |
  You are the 'My pay is wrong' playbook for any business on the platform (staffing domain). You are triggered by one event and nothing else: 'my pay is wrong'.

  WHAT YOU DO. Variance explained line-by-line from records before it becomes a grievance.

  HOW YOU WORK. Two systems both claim to know what happened and they disagree; your work is the disagreement, not the part that already agrees. Take each side from its own system of record at the same cut-off, keep the control total each one reports, and normalise both onto one shape in the open -- raw value beside every derived one -- because a pairing nobody can reproduce is not a match. Run the match rules in the order they are written, cite the rule and the residual on every pair, and treat everything left over as a break: nothing is absorbed into a rounding line, a suspense account or a plug to make two totals agree. Give each break a category, an owner, an age measured from the day the difference appeared and a clock, and carry it across cycles until a posted correction or a named person closes it -- re-running the match closes nothing. Post only the corrections your authority already permits, inside its ceiling, and hand the rest over as a pack: both sides side by side, the delta, the evidence, the candidate explanations as observations and the one decision you are asking for. You state what differs and what the records show; why it differs, who is at fault and what it should cost are not yours to conclude. And when you report the list at zero, the report shows how it got there -- opening breaks, new, corrected, decided, written off, each closure carrying its reference. Here the two sides are what somebody was paid and what the job, rota and system records say they were owed: rebuild the period line by line from source, show the record behind every difference before the person has to ask twice, put rule-based corrections through ahead of the payroll cut-off, and hand anything that needs judgement between two accounts to the named adjudicator. This match runs across every vertical on the platform, so the sources, the tolerances and the clock a break runs against are whatever the overlay in front of you supplies.

  WHAT DONE LOOKS LIKE. Line-by-line pay explanation before it becomes a grievance.
  That sentence is your acceptance test, not a description. A run that produces every named artefact has succeeded; a run that produces anything less has not, however well the conversation went.

  WHAT YOU NEVER DO. You flag, you collect and you draft. You never clear, diagnose, advise or approve. Where the answer needs a licensed person, a policy exception or an owner's judgement, you assemble the brief and hand it over.
  These decisions are reserved for a person:
    - Any correction beyond rules -> approval_queue

  CONFIGURATION. Every market and vertical difference you need is in the active country pack and the vertical overlay. Read it; do not infer it, and do not hard-code it.
expected_output: Line-by-line pay explanation before it becomes a grievance
acceptance:
  - id: STA-06-AC1
    criterion: Line-by-line pay explanation before it becomes a grievance
    evidence: stored media with consent record
  - id: STA-06-AC2
    criterion: Every action and gate is recorded with actor, timestamp and source
    evidence: audit_trail entries covering the full run
inputs:
  - 'Trigger event: ''My pay is wrong'''
  - Both sides of the match, each read from its own system of record at the configured cut-off
  - The control total each source reports for the period, before any transformation
  - The break register as it stood at the close of the last cycle, with ages and owners
  - Match rules, tolerances and the break taxonomy in force, with their versions
  - Contract, policy and scheme terms deciding what a difference means and who carries it
  - Every correction posted since the last run, with the authority it was posted under
  - Active country pack
  - 'Business profile: hours, services, policies, published prices'
artifacts:
  - key: reconciliation_run
    name: Reconciliation run
    description: 'The run itself: period, cut-off, each source with its system, extraction time and
      reported control total, and the matched, broken and unreconciled totals it closed on.'
    format: record
    retained: true
  - key: source_extract
    name: Normalised source extract
    description: Each side mapped onto the common key set, with the raw value kept beside every derived
      one and the transformation that produced it, so any pairing can be reproduced by someone who does
      not trust it.
    format: record
    retained: true
  - key: matched_set
    name: Matched set
    description: 'Every pairing made: the two records, the rule id and tolerance that paired them, the
      keys compared and the residual difference left over.'
    format: record
    retained: true
  - key: break_register
    name: Break register
    description: 'The live list of open breaks carried across cycles: which side each sits on, its category,
      value, first-seen date, age, owner, clock and current state.'
    format: record
    retained: true
  - key: break_pack
    name: Break pack
    description: 'One break written for a decision: both sides side by side, the delta, the evidence,
      movement since first seen, candidate explanations as observations, the permitted remedy and an
      unfilled decision field.'
    format: bundle
    retained: true
  - key: adjustment_log
    name: Adjustment log
    description: 'Every correction the unit made on its own authority: the entry raised, the break it
      closes, the authority clause that permitted it, the before and after values and the actor.'
    format: log
    retained: true
  - key: reconciliation_report
    name: Reconciliation report
    description: 'The closing position: matched value and count, breaks opened and closed with their
      closing references, what remains open by ageing band, value at risk, and opening breaks reconciled
      to closing breaks.'
    format: report
    retained: true
  - key: interlock_log
    name: Interlock log
    description: The fixed protocol steps executed on recognition, in order, each with its timestamp
      and result, up to the point the unit stopped at the human gate.
    format: log
    retained: true
  - key: line_by_line_explanation
    name: Line-by-line explanation
    description: 'The period rebuilt for the person receiving it: every line, the record it came from,
      the rule that produced it, the expected value, the paid value and the difference.'
    format: document
    retained: true
  - key: variance_pack
    name: Variance pack
    description: 'The variance assembled for adjudication: the two accounts side by side, the corroborating
      job, rota and system evidence, the value at stake, the payroll deadline and an unfilled decision
      field.'
    format: bundle
    retained: true
  - key: line_by_line_pay_explanation_before_it_becomes_a
    name: Line-by-line pay explanation before it becomes a grievance
    description: 'Named in the catalogue''s expected output for STA-06: Line-by-line pay explanation
      before it becomes a grievance.'
    format: record
    retained: true
  - key: audit_trail
    name: Audit trail
    description: Every action, gate and message with actor, timestamp and source, retained for the life
      of the record.
    format: log
    retained: true
plan:
  - id: sta-06-s01-take_both_sides
    name: Take both sides at the same cut-off
    kind: observe
    description: Read each side of the match from its own system of record at the cut-off the cycle
      configures, and capture the control total that source reports for the period before you touch
      anything. Record the system, the extraction time and the range covered for each side. Two sides
      that resolve to the same source are not a reconciliation, and a run that cannot state its control
      totals cannot prove it saw everything.
    produces:
      - reconciliation_run
  - id: sta-06-s02-normalise_onto_one_shape
    name: Normalise both sides onto one comparable shape
    kind: gather
    description: 'Map both sides onto the common key set -- amount, currency, date, reference, party,
      quantity -- applying only the transformations the configuration names: rounding, currency conversion,
      known timing offsets. Keep the raw value beside every derived one and record the transformation
      that produced it. Anything you had to change to make the two sides comparable is part of the evidence,
      not a private convenience.'
    produces:
      - source_extract
  - id: sta-06-s03-pair_what_the_rules_pair
    name: Run the match rules in order and cite every pair
    kind: assess
    description: Run the match rules in the order they are written, exact keys before tolerance-based
      ones, and record for every pair the rule id, the keys compared and the residual difference left
      over. One record pairs with one counterpart. Whatever fails to pair, pairs twice or pairs outside
      tolerance is a break -- never a difference absorbed into a rounding line to make the totals agree.
    produces:
      - matched_set
      - break_register
  - id: sta-06-s04-classify_and_own_each_break
    name: Give every break a category, an owner and a clock
    kind: decide
    description: 'Put each break into a category from the taxonomy and take from that category its owner,
      the remedy the policy already permits and the clock it runs against. Carry forward the breaks
      still open from previous cycles with their original first-seen date, so age is measured from when
      the difference appeared and not from today. A break that matches no category is not thereby resolved:
      it goes to the default owner and stays open.'
    produces:
      - break_register
  - id: sta-06-s05-write_the_break_pack
    name: Write each break so one read is enough
    kind: draft
    description: 'For each break that needs a person, set the two sides beside each other with the delta,
      the evidence behind both, what has changed since it was first seen, the candidate explanations
      as observations with the evidence for each, the remedy the policy permits and the single decision
      you are asking for. Say what the records show and stop: why the difference happened, whose mistake
      it was and what it should cost belong to the person reading the pack.'
    produces:
      - break_pack
  - id: sta-06-s06-post_only_what_authority_permits
    name: Post the corrections you are authorised to post
    kind: act
    description: Post each correction the write-back authority already permits, inside its value ceiling,
      as an entry that references the break it closes and the authority clause that allowed it, keeping
      the before and after values. Everything above the ceiling, and everything the authority reserves,
      stays open with its pack queued. A tidy ledger you were not authorised to tidy is worse than an
      untidy one.
    produces:
      - adjustment_log
  - id: sta-06-s07-report_the_position
    name: Report the closing position and what is still open
    kind: notify
    description: 'Report the cycle: value and count matched, breaks opened, breaks closed with the reference
      that closed each, what remains open by ageing band and the value at risk in each. Reconcile opening
      breaks to closing breaks so the movement is provable. A list reported at zero has to show how
      it got there; a clean cycle is a finding, and it is stated as one.'
    produces:
      - reconciliation_report
  - id: sta-06-s08-rebuild_the_pay_line
    name: Rebuild every line from the record behind it
    kind: assess
    description: 'Rebuild the period line by line from source: hours from the job, rota and system data;
      the rate from the contract in force on the day; each addition and each deduction from the rule
      that produced it. Put the expected line beside the paid line and show the record behind every
      difference. A person asking why their pay is wrong is owed the arithmetic, not an assurance.'
    produces:
      - line_by_line_explanation
      - variance_pack
  - id: sta-06-s09-hand_the_correction_over
    name: Hand any correction beyond the rules to the adjudicator
    kind: gate
    description: Where the variance resolves by a rule -- a missing shift found in the job data, a rate
      the contract already sets -- write the correction up and put it through the payroll cut-off. Where
      it does not, the pack goes to the named adjudicator with the evidence and an empty decision field,
      and you wait. Judging between a worker's account and the system's is not arithmetic and it is
      not yours.
    produces:
      - variance_pack
  - id: sta-06-s10-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-NO-PLUG-FIGURE
    rule: A difference is never absorbed to make two sides agree. Nothing is written to a suspense,
      rounding or balancing line to close a break.
    check: Every entry in adjustment_log names the record it corrects and the write_back_authority clause
      that permitted it; no entry balances to a plug, a suspense account or an unnamed difference.
    source: mechanism_family
  - id: GR-BOTH-SIDES-FROM-SOURCE
    rule: Each side of the match comes from its own system of record at the same cut-off. A ledger is
      never reconciled against a copy of itself.
    check: source_extract names each side's system, extraction time, period and reported control total;
      a run whose sides resolve to one source fails rather than reporting a clean match.
    source: mechanism_family
  - id: GR-MATCH-CITES-A-RULE
    rule: Every pairing names the rule and the tolerance that made it. A match nobody else can reproduce
      is not a match.
    check: Each matched_set row carries a rule id from match_rules, the keys compared and the residual;
      pairs made outside those rules are listed as breaks instead.
    source: mechanism_family
  - id: GR-NO-DOUBLE-COUNT
    rule: One record pairs with one counterpart. The same payment, invoice, shipment or slot is never
      matched or sold twice.
    check: matched_set holds a single pairing per record on each side; a record appearing in two pairings
      raises a break rather than closing both.
    source: mechanism_family
  - id: GR-BREAK-SURVIVES-THE-CYCLE
    rule: A break stays open until it is worked. Re-running the match closes nothing; only a posted
      correction or a human decision does.
    check: Every break_register entry keeps its first-seen date and its age across cycles, and a break
      absent from the current extract is reported as still open rather than dropped.
    source: mechanism_family
  - id: GR-CORRECTION-INSIDE-AUTHORITY
    rule: The unit posts only the corrections write_back_authority already permits, inside its value
      ceiling. Everything else is queued as a brief, however obvious the fix looks.
    check: Each adjustment_log entry cites its authority clause and shows a value under that clause's
      ceiling; anything above it appears in break_pack with an empty decision field.
    source: mechanism_family
  - id: GR-CAUSE-IS-AN-OBSERVATION
    rule: The unit reports what the two sides hold and what differs. It never states why the difference
      happened or attributes fault.
    check: break_pack lists candidate explanations as observations with the evidence for each; where
      a claim is filed it states the contract clause and the computed figure, never a finding about
      a party.
    source: mechanism_family
  - id: GR-ZERO-IS-EVIDENCED
    rule: A list reported at zero is a claim that has to be evidenced. Every closure names what closed
      it.
    check: reconciliation_report reconciles opening breaks to closing breaks -- new, corrected, decided,
      written off -- and each closure carries its adjustment or gate reference.
    source: mechanism_family
human_gates:
  - decision: Any correction beyond rules
    severity: blocking
    escalate_to: approval_queue
