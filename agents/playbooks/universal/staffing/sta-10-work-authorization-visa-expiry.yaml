    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: date_rules
    description: 'How each dated obligation this unit holds is derived: the anchor event it counts from,
      the interval or term, and whether the period runs in calendar or working days.'
    resolved_by: vertical
    required: true
  - key: lead_time_ladder
    description: 'The rungs in front of each due date: how far ahead each one fires, on which channel,
      to whom, and which rung stops being a reminder and becomes an escalation.'
    resolved_by: vertical
    required: true
  - key: working_calendar
    description: Working days, public holidays, weekend convention, time zone and quiet hours for this
      market. Every due date and every send is adjusted against it before it is set.
    resolved_by: country_pack
    required: true
  - key: statutory_date_sets
    description: Statutory, filing and seasonal date sets for this market, from the active country pack,
      with the counting convention each one uses.
    resolved_by: country_pack
    required: true
  - key: suppression_rules
    description: 'When a due date must not generate contact: already satisfied, already booked, opted
      out, in dispute, bereaved or dormant -- plus frequency caps and the quiet hours no rung may cross.'
    resolved_by: owner
    required: true
  - key: completion_rules
    description: What proves a dated obligation was met -- booking reference, receipt, returned confirmation,
      filed certificate -- so nothing is ever closed by time having passed.
    resolved_by: vertical
    required: true
  - key: credential_types
    description: Every credential, permission or status document this business must hold for its people,
      suppliers and clients, with its validity period, its issuer and the evidence that proves it.
    resolved_by: vertical
    required: true
  - key: lapse_restrictions
    description: What a holder may not do once a document has lapsed, who enforces it, who must be told,
      and the hard cut-off beyond which no discretion exists.
    resolved_by: owner
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
kpis:
  - dates actioned inside their lead-time window
  - obligations that passed their date unseen
  - rungs delivered against rungs scheduled
  - dates closed on filed evidence rather than on elapsed time
  - decisions handed over before the date forced them
  - credentials renewed before their expiry date
  - restricted activity attempted on a lapsed credential
