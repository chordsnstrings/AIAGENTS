      the channel each one uses.'
    resolved_by: vertical
    required: true
  - key: stop_conditions
    description: What ends a journey early -- reply, conversion, opt-out, complaint, bereavement or
      vulnerability flag -- and which of them also suppress future journeys.
    resolved_by: owner
    required: true
  - key: frequency_caps
    description: Maximum automated touches one contact may receive per window, counted across every
      journey rather than within this one.
    resolved_by: owner
    required: true
  - key: contactable_hours
    description: Hours, days and dates on which an automated touch may be sent in this market, read
      in the recipient's own timezone.
    resolved_by: country_pack
    required: true
  - key: consent_basis
    description: The lawful basis and consent record this market requires before an outbound touch,
      per channel, with the opt-out wording.
    resolved_by: country_pack
    required: true
  - key: suppression_list
    description: Contacts no journey may touch, with the reason and the date the suppression was applied.
    resolved_by: owner
    required: true
  - key: offer_set
    description: The incentives, discounts and rewards this journey may put in writing, with the value
      and expiry of each. The unit picks from this list and never composes a new one.
    resolved_by: owner
    required: true
  - key: onboarding_plan
    description: Tasks and checkpoints by role or account type, with the offset from the start date
      for each.
    resolved_by: vertical
    required: true
  - key: task_owners
    description: Which role owns each onboarding task, with a fallback.
    resolved_by: owner
    required: true
  - key: activation_milestones
    description: What counts as activated for this account type, and by when.
    resolved_by: vertical
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
