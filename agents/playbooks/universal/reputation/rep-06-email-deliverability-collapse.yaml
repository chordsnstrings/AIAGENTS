artifacts:
  - key: queue_item
    name: Queue item
    description: 'The exception itself: source system, raw signal, first-seen and occurred times, dedupe
      key, occurrence count, current state, owner and response clock.'
    format: record
    retained: true
  - key: evidence_pack
    name: Evidence pack
    description: 'The context attached to the item so the recipient decides without opening another
      system: the record it concerns, the party, the history of this subject and prior items with their
      outcomes.'
    format: bundle
    retained: true
  - key: triage_grade
    name: Triage grade
    description: The category and severity assigned, the rule id that produced them, the values that
      rule read and the response clock the band carries.
    format: record
    retained: true
  - key: suppression_log
    name: Suppression log
    description: Every item held back from a person, with the suppression rule that permitted it, the
      evidence that rule required and the sample later re-tested against it.
    format: log
    retained: true
  - key: exception_brief
    name: Exception brief
    description: 'The surfaced item written for one read: what fired, why it matters, the evidence with
      sources, the options and the single decision being asked for.'
    format: document
    retained: true
  - key: routing_record
    name: Routing record
    description: 'Where the item went and why: the desk, the rule that chose it, the named owner, the
      time it was placed and every reassignment since.'
    format: record
    retained: true
  - key: queue_digest
    name: Queue digest
    description: 'The cycle''s summary: what surfaced, what is still open against its clock, what breached,
      what volume was held back and under which rules -- including the cycle where nothing needed a
      person.'
    format: report
    retained: true
  - key: interlock_log
    name: Interlock log
    description: The fixed protocol steps executed on recognition, in order, each with its timestamp
      and result, up to the point the unit stopped at the human gate.
    format: log
    retained: true
  - key: diagnostic_record
    name: Check results record
    description: Each configured check with what it returned and when, the protective step applied if
      any, and the observations passed to whoever owns the permanent fix.
    format: log
    retained: true
  - key: workaround_notice
    name: Workaround notice
    description: What the customer can do meanwhile, what it does not cover, how long it stands, and
      the renewal, contract or reputation risk the outage has been flagged against.
    format: message
    retained: true
  - key: diagnostics_run
    name: Diagnostics run
    description: 'Named in the catalogue''s expected output for REP-06: Diagnostics run.'
    format: record
    retained: true
  - key: sending_paused
    name: Sending paused
    description: 'Named in the catalogue''s expected output for REP-06: Sending paused.'
    format: record
    retained: true
  - key: fixes_executed
    name: Fixes executed
    description: 'Named in the catalogue''s expected output for REP-06: Fixes executed.'
    format: record
    retained: true
  - key: report
    name: Report
    description: 'Named in the catalogue''s expected output for REP-06: Report.'
    format: record
    retained: true
  - key: audit_trail
    name: Audit trail
    description: Every action, gate and message with actor, timestamp and source, retained for the life
      of the record.
    format: log
    retained: true
plan:
  - id: rep-06-s01-take_the_item_in
    name: Read the queue
    kind: observe
    description: 'Poll every configured source from its last position and take in each new item with
      its raw signal, its source system and the time it actually occurred rather than the time you saw
      it. An item you read is an item you now own: nothing is skimmed past.'
    produces:
      - queue_item
  - id: rep-06-s02-collapse_and_enrich
    name: Collapse duplicates and attach the context
    kind: gather
    description: 'Join repeats onto one entry on the configured key and window, keeping every occurrence
      and the count rather than discarding the extras. Then attach what the recipient would otherwise
      go and fetch: the record it concerns, the party behind it, the history of this subject and what
      happened the last times this fired.'
    produces:
      - evidence_pack
      - queue_item
  - id: rep-06-s03-grade_against_the_rules
    name: Grade it against the written rules
    kind: assess
    description: Score the item against the triage rules and the severity matrix, and record the rule
      id, the values it read and the band it produced. A severity you cannot trace back to a named rule
      is a guess; guesses are graded at the default band and never quietly downgraded.
    produces:
      - triage_grade
  - id: rep-06-s04-surface_or_hold_back
    name: Decide what a person actually needs to see
    kind: decide
    description: 'Hold an item back only where the suppression rules positively permit it and the evidence
      they require is present, and log that item with the rule that allowed it. Everything else surfaces,
      and anything ambiguous surfaces: the queue''s licence to filter rests entirely on the held-back
      list being auditable.'
    produces:
      - suppression_log
  - id: rep-06-s05-write_the_packet
    name: Write it so one read is enough
    kind: draft
    description: 'Compose the item for the person receiving it: what fired, why it matters here, the
      evidence with its sources, the options open and the single thing you are asking them to decide.
      Write what the signal shows and stop there -- what it means about a person, a cause or an intent
      is theirs to conclude, not yours to suggest.'
    produces:
      - exception_brief
  - id: rep-06-s06-place_it_on_the_queue
    name: Place the item with an owner and a clock
    kind: act
    description: Write the item to the queue with its grade, the desk the routing table names for it,
      a named owner and the response clock its band demands. An item on the queue without an owner and
      a clock is an item nobody has agreed to look at.
    produces:
      - routing_record
      - queue_item
  - id: rep-06-s07-tell_the_recipient
    name: Tell the person whose problem it is
    kind: notify
    description: 'Send at the volume the severity band sets -- immediately to the named contact, or
      in the digest -- using the out-of-hours contact where the band demands one. When a cycle produces
      nothing that needs a person, the digest says so explicitly: a quiet queue is a finding, not an
      absence of one.'
    produces:
      - queue_digest
  - id: rep-06-s08-issue_the_workaround
    name: Run the fixed checks and get the customer working again
    kind: act
    description: Run the check list the configuration names for this failure class and record what each
      check returned -- reachable or not, record present or absent, token valid or expired -- as observations
      with their timestamps, not as a verdict about the cause. Apply the protective step the policy
      allows where one is named, issue the temporary workaround the customer may use meanwhile, tell
      them plainly that it is temporary, and hold the item open against the permanent fix and the commercial
      risk the outage created.
    produces:
      - diagnostic_record
      - workaround_notice
  - id: rep-06-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-NO-SILENT-SUPPRESSION
    rule: Nothing leaves the queue unseen without a rule that permitted it. Filtering is licensed by
      the held-back list, not assumed.
    check: Every item not surfaced has a suppression_log entry naming the suppression_rules clause and
      the evidence it required; an item with no matching clause is surfaced instead.
    source: mechanism_family
  - id: GR-GRADE-CITES-A-RULE
    rule: Every severity and category is produced by a named rule, not by an impression of how serious
      the item looks.
    check: triage_grade carries a rule id from triage_rules and the input values it read; an item that
      matches no rule is graded at the default band of severity_matrix and surfaced.
    source: mechanism_family
  - id: GR-FLAG-NOT-VERDICT
    rule: The unit states what fired and what the evidence shows. It never states what that means about
      a person, a cause or an intent.
    check: The outbound packet contains no conclusion, accusation or root-cause statement, and its decision
      field is empty until the named human fills it.
    source: mechanism_family
  - id: GR-DEDUPE-KEEPS-THE-COUNT
    rule: Collapsing duplicates joins occurrences to one entry; it never discards them to make the queue
      look shorter.
    check: Each merged entry retains every source event and its occurrence count, and the merge key
      and window are the ones dedupe_window configures.
    source: mechanism_family
  - id: GR-OWNER-AND-CLOCK
    rule: Every surfaced item carries a named owner and a response clock, and an item that ages past
      its clock escalates rather than sits.
    check: No item is placed without an owner and a clock from severity_matrix; breaches appear in queue_digest
      and re-route to the escalation contact.
    source: mechanism_family
  - id: GR-CONTROL-NOT-LIFTED
    rule: A hold, block, freeze or pause the unit applied is lifted by the named human. The unit applies
      the prescribed control and stops.
    check: control_record shows the clause that required each control and the role that may lift it;
      no plan step releases a control the unit itself applied.
    source: mechanism_family
  - id: GR-FILTER-MEASURED
    rule: 'Noise reduction is measured rather than assumed: what the queue held back is sampled against
      what humans later re-opened.'
    check: Each cycle re-tests a sample of suppressed items against reopened and escalated ones, and
      reports the miss rate in queue_digest.
    source: mechanism_family
human_gates:
  - decision: Anything outside the configured policy bounds
    severity: blocking
    escalate_to: approval_queue
    note: The workbook reserves no named decision for this unit; the policy boundary is still a gate.
