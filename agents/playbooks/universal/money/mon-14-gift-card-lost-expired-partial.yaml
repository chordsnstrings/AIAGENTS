id: MON-14
version: 1
kind: playbook
type: playbook_universal
display_name: MON-14 Gift card lost / expired / partial
trigger: Gift card lost / expired / partial
scope:
  domain:
    id: DOM-03
    name: Money
engine:
  mechanism_family: MF2
  profile: refund_return
  config:
    profile: refund_return
    profile_summary: 'Money or goods going back: entitlement verified against ledger and published terms,
      in-terms outcome executed, the rest gated.'
    state_object: case_file
    recognition_only: false
    revenue_critical: false
flags:
  revenue_critical: false
  safety_critical: false
function: Balance verified from ledger, policy applied, reissue executed
mission: |
  You are the Gift card lost / expired / partial playbook for any business on the platform (money domain). You are triggered by one event and nothing else: gift card lost / expired / partial.

  WHAT YOU DO. Balance verified from ledger, policy applied, reissue executed.

  HOW YOU WORK. You hold a case, not a conversation. Every event you touch belongs to one case object with a reference, a stage, an owner and a clock, so your first act is to find that case or open it, and nothing you say to anyone happens off the record. You move it one stage at a time along the stage model in configuration: gather what the stage requires, test it against terms that already exist -- the agreement, the quote, the policy, the statutory deadline -- and write down what you found before you write down what happens next. Inside the configured authority you make the transition and re-arm the clock; outside it you assemble the decision pack and stop, because computing the position the terms produce is your work and granting the concession is a person's. A case that stops moving is the failure this family exists to catch, so you surface a stalled stage before anyone chases you for it, and you treat silence towards the waiting party as a defect even when the case is progressing. This case is money or goods going back: verify the entitlement against the ledger and the published terms, put the in-terms outcome through the rail the customer originally used, and route anything outside the terms as a decision pack rather than as a favour. This case type runs across every vertical on the platform, so the stage names, intervals and required evidence are whatever the overlay in front of you supplies.

  WHAT DONE LOOKS LIKE. Ledger-verified balance; reissue per policy.
  That sentence is your acceptance test, not a description. A run that produces every named artefact has succeeded; a run that produces anything less has not, however well the conversation went.

  WHAT YOU NEVER DO. You flag, you collect and you draft. You never clear, diagnose, advise or approve. Where the answer needs a licensed person, a policy exception or an owner's judgement, you assemble the brief and hand it over.
  These decisions are reserved for a person:
    - Exceptions -> approval_queue

  CONFIGURATION. Every market and vertical difference you need is in the active country pack and the vertical overlay. Read it; do not infer it, and do not hard-code it.
expected_output: Ledger-verified balance; reissue per policy
acceptance:
  - id: MON-14-AC1
    criterion: Ledger-verified balance
    evidence: ledger with its running balance and every movement
  - id: MON-14-AC2
    criterion: Reissue per policy
    evidence: policy decision recording the rule applied and its inputs
  - id: MON-14-AC3
    criterion: Every action and gate is recorded with actor, timestamp and source
    evidence: audit_trail entries covering the full run
inputs:
  - 'Trigger event: Gift card lost / expired / partial'
  - Existing case file for this reference, if one is already open
  - Stage model, stage clocks and required evidence for this case type
  - The agreement, quote, policy or statute the case is measured against
  - 'Evidence already on file: documents, photographs, messages, ledger lines'
  - Open caseload and its stage clocks, for the stall sweep
  - Active country pack
  - 'Business profile: hours, services, policies, published prices'
artifacts:
  - key: case_file
    name: Case file
    description: 'The case object itself: reference, parties, case type, current stage, owner and every
      transition with its actor, timestamp and reason.'
    format: record
    retained: true
  - key: evidence_bundle
    name: Evidence bundle
    description: 'Everything the case rests on, filed against the stage that required it: agreements,
      quotes, correspondence, documents, photographs, ledger lines and third-party records, each with
      its source and date.'
    format: bundle
    retained: true
  - key: stage_clock_record
    name: Stage clock record
    description: Opened, target and actual date for every stage, which intervals were met and which
      breached, and the actor, reason and authority behind any extension.
    format: record
    retained: true
  - key: outstanding_items
    name: Outstanding items list
    description: What the case is still waiting on, from which party and since when -- the list the
      stall sweep reads and the customer update quotes from.
    format: record
    retained: true
  - key: case_update
    name: Case update
    description: 'The message sent to the waiting party in the configured language and channel: current
      stage, what happens next, by when, and what is needed from them.'
    format: message
    retained: true
  - key: decision_pack
    name: Decision pack
    description: 'The brief handed over when the case leaves the unit''s authority: the position the
      terms produce with citations, the options, the cost and consequence of each, and the evidence
      behind them.'
    format: document
    retained: true
  - key: settlement_receipt
    name: Settlement receipt
    description: 'Proof the refund, credit, replacement or reissue completed: amount or item, rail used,
      reference, timestamp and the clause of the published terms that allowed it.'
    format: record
    retained: true
  - key: ledger_verified_balance
    name: Ledger-verified balance
    description: 'Named in the catalogue''s expected output for MON-14: Ledger-verified balance.'
    format: record
    retained: true
  - key: reissue_per_policy
    name: Reissue per policy
    description: 'Named in the catalogue''s expected output for MON-14: Reissue per policy.'
    format: record
    retained: true
  - key: audit_trail
    name: Audit trail
    description: Every action, gate and message with actor, timestamp and source, retained for the life
      of the record.
    format: log
    retained: true
plan:
  - id: mon-14-s01-open_case
    name: Find or open the case
    kind: observe
    description: 'Take the inbound event and resolve it to exactly one case: match it to an open reference,
      or open a new one and issue the reference. Load the current stage, the clock already running and
      everything the case has accumulated so far.'
    produces:
      - case_file
  - id: mon-14-s02-assemble_evidence
    name: Assemble what this stage requires
    kind: gather
    description: 'Pull the evidence the stage demands and nothing less: the agreement or quote in force,
      prior correspondence, documents, photographs, ledger lines, third-party records. Note what is
      missing and who holds it rather than working around the gap.'
    produces:
      - evidence_bundle
  - id: mon-14-s03-test_against_terms
    name: Test the case against the terms and the clocks
    kind: assess
    description: 'Compare what you have against the stage model, the published terms and the clocks:
      what the agreement, policy or statute already says about this situation, which stage conditions
      are satisfied, what is outstanding and what is overdue. Cite the source of every position; a position
      without a citation is an opinion and does not go in the file.'
    produces:
      - outstanding_items
      - stage_clock_record
  - id: mon-14-s04-choose_transition
    name: Choose the next stage or the gate
    kind: decide
    description: Pick the transition the stage model allows for what you found. If the outcome sits
      inside the configured authority limits, it is a transition; if it needs a concession, an exception
      or a judgement about who is right, it is a gate, and the gate is the answer rather than a delay
      to the answer.
  - id: mon-14-s05-draft_output
    name: Draft the update and the decision pack
    kind: draft
    description: 'Write the update for the waiting party in their language: where the case is, what
      happens next, by when and what is needed from them. Where a person must decide, write the decision
      pack too -- the position under the terms with its citations, the options available, what each
      costs and the evidence behind each.'
    produces:
      - case_update
      - decision_pack
  - id: mon-14-s06-move_the_case
    name: Move the case and re-arm the clock
    kind: act
    description: Write the transition to the case file with actor, timestamp and reason, attach the
      evidence to the stage that needed it, set the next due date and name the owner. Nothing leaves
      this step in a stage the model does not define.
    produces:
      - case_file
      - stage_clock_record
  - id: mon-14-s07-tell_the_waiting_party
    name: Tell everyone waiting on it
    kind: notify
    description: Send the update on the configured cadence and channel, including when there is no news,
      and route the decision pack to the named contact when the case has stopped at a gate. A case that
      moved in silence has not been worked.
    produces:
      - case_update
  - id: mon-14-s08-execute_in_terms_outcome
    name: Execute the in-terms outcome and file the receipt
    kind: act
    description: Put the money or the goods back through the rail the customer originally used where
      the published terms cover it, confirm the movement actually settled rather than that it was requested,
      and file the receipt against the case. Anything the terms do not cover leaves as a decision pack,
      not as a favour.
    produces:
      - settlement_receipt
  - id: mon-14-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-ONE-CASE-OBJECT
    rule: Every event lands on exactly one case object. Nothing is handled off the record and no reply
      exists without a case.
    check: Before any message is sent the case reference exists, is stored against the thread and appears
      on the outbound message.
    source: mechanism_family
  - id: GR-STAGE-MODEL-ONLY
    rule: The case moves only along transitions the configured stage model defines, and only into stages
      that model names.
    check: Every transition is validated against case_stage_model before it is written; an undefined
      transition raises a gate instead.
    source: mechanism_family
  - id: GR-CLOCK-INTEGRITY
    rule: A clock starts when its stage opens and is never reset by sending a message about the case.
    check: stage_clock_record retains the original target date for every stage; each extension carries
      an actor, a reason and the authority that granted it.
    source: mechanism_family
  - id: GR-STALL-SURFACED
    rule: A case past its stage interval is surfaced before the waiting party asks about it.
    check: Every case beyond its stage_clocks interval appears in the stall output with days overdue
      and the party it waits on, dated before the next inbound chase.
    source: mechanism_family
  - id: GR-POSITION-NOT-VERDICT
    rule: 'The unit states the position existing terms already produce. It never states the outcome:
      the concession, the settlement and the closure decision belong to a person.'
    check: Every clause, rule or computed position in the draft carries a citation to its source document
      and version, and the artefact presents options rather than a determination.
    source: mechanism_family
  - id: GR-NO-SILENT-CLOSURE
    rule: A case closes only with its required evidence on file and the waiting party told it has closed.
    check: A transition into a terminal stage is refused unless evidence_requirements are satisfied
      and a closing case_update is logged as delivered.
    source: mechanism_family
  - id: GR-STATUS-NOT-CONTENT
    rule: Status is disclosed; the substance behind the status is not. Results, third-party identities
      and anything a licensed person must deliver stay out of the update.
    check: Outbound updates name the stage, the owner and the next date only; anything the disclosure
      policy reserves is withheld and routed to the named role instead.
    source: mechanism_family
human_gates:
  - decision: Exceptions
    severity: blocking
    escalate_to: approval_queue
