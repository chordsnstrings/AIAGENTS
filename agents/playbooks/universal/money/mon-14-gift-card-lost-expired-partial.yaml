config_keys:
  - key: language_set
    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: case_stage_model
    description: Stages for this case type, their entry and exit conditions, the transitions allowed
      between them and which stages are terminal.
    resolved_by: vertical
    required: true
  - key: stage_clocks
    description: Target and breach interval for each stage, and the working calendar those intervals
      run against.
    resolved_by: vertical
    required: true
  - key: statutory_clocks
    description: Deadlines set by law or by contract that override the internal intervals, from the
      active country pack.
    resolved_by: country_pack
    required: true
  - key: evidence_requirements
    description: What must be on file before the case may enter each stage, and before it may close.
    resolved_by: vertical
    required: true
  - key: update_cadence
    description: How often the waiting party is told where the case stands, per stage and per channel,
      including the no-news update.
    resolved_by: owner
    required: true
  - key: authority_limits
    description: The value, concession and goodwill limits below which the unit may execute the outcome
      the terms produce, and above which it gates.
    resolved_by: owner
    required: true
  - key: refund_matrix
    description: What is refundable, creditable or replaceable, in what window and on what rail, with
      the goodwill threshold that gates.
    resolved_by: owner
    required: true
  - key: return_window
    description: Return, exchange and reissue windows for this vertical, and the condition the goods
      must be in.
    resolved_by: vertical
    required: true
kpis:
  - stage cycle time against the configured interval
  - cases stalled beyond their stage clock
  - update cadence met without a customer chase
  - cases closed with the required evidence on file
  - reopen rate after closure
  - in-terms outcomes executed without a gate
  - settlements confirmed as settled, not merely requested
