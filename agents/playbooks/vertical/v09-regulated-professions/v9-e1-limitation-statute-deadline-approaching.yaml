plan:
  - id: v9-e1-s01-read_the_clock
    name: Read the clock and pull what is in the window
    kind: observe
    description: Fix the run date against the market's working calendar, time zone and holidays, then
      pull every dated obligation whose lead-time window is now open together with everything already
      past its date and not yet discharged. The sweep runs on its schedule whether or not anything is
      due; an empty window is a result you report, not a run that did not happen.
    produces:
      - due_window_list
  - id: v9-e1-s02-assemble_the_dates
    name: Re-derive each date and load what sits behind it
    kind: gather
    description: 'Recompute each due date from its anchor and the configured rule rather than trusting
      the number stored last time, and load the record it belongs to: the agreement, treatment, asset,
      invoice, credential or matter, the contact and consent state of everyone a rung would reach, and
      any evidence already filed against it.'
    produces:
      - date_register
  - id: v9-e1-s03-place_on_the_ladder
    name: Place every date on its ladder
    kind: assess
    description: 'Work out, for each date, how far it is from due in the calendar that governs it, which
      rung that distance selects, whether the obligation is already satisfied, suppressed, opted out
      or in dispute, and whether the remaining time is still enough for the thing to be done. Show the
      arithmetic: a date you cannot derive is a date you may not act on.'
    produces:
      - date_register
  - id: v9-e1-s04-choose_the_rung
    name: Choose the rung, the escalation or the gate
    kind: decide
    description: 'For each date, pick what the ladder says: fire the next rung, hold because a suppression
      applies, or stop because the date forces a judgement -- renew or exit, elect or default, enforce
      or waive, restrict or let it run. Where it is a judgement, the gate is the answer and it is raised
      now, with time still on the clock, rather than reported after the date has gone.'
  - id: v9-e1-s05-draft_the_notice
    name: Draft the rung and, where needed, the brief
    kind: draft
    description: 'Write the rung in the recipient''s language and channel: what is due, the date it
      is due, what happens if it is missed as the rule or the terms already document it, and the one
      action that discharges it with a way to take it. Where a person must decide, draft the brief alongside
      -- the options, what each costs, the deadline on the decision itself.'
    produces:
      - advance_notice
      - decision_brief
  - id: v9-e1-s06-act_and_rearm
    name: Send, book, file, and re-arm the clock
    kind: act
    description: Send the rung from the customer's own connected accounts inside the configured quiet
      hours, take the action the date exists for where it is within your authority -- the booking, the
      payment link, the submission, the restriction -- record the evidence that discharges the obligation,
      and set the next due date from the rule rather than from today. An obligation is never marked
      met because a message about it went out.
    produces:
      - ladder_log
      - completion_evidence
  - id: v9-e1-s07-raise_what_is_at_risk
    name: Raise everything still at risk to a named owner
    kind: notify
    description: 'Send the exception list on its own cadence: what is overdue, what is undeliverable,
      what is unowned, what will be missed at the present rate and what needs a decision, each with
      the name of the person it now sits with. Send it whether or not anything went wrong, because the
      absence of an exception list reads exactly like a run that never happened.'
    produces:
      - exception_report
  - id: v9-e1-s08-verify_the_docket
    name: Re-derive every docketed date and check it still holds
    kind: assess
    description: Recompute each docketed date from its anchor and its rule, re-check it against the
      current calendar and against anything that has changed in the underlying matter, and confirm each
      one still has a named owner with the preparatory work sequenced backwards from it. A date nobody
      owns is a date nobody meets.
    produces:
      - docket_entry
  - id: v9-e1-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-DATE-IS-DERIVED
    rule: Every due date is derived from an anchor in the record and a rule in configuration. No date
      is typed in, remembered or inferred from a previous message.
    check: Each date_register entry carries its anchor date, the source field or document it came from
      and the date_rules id that produced it; an entry missing any of the three cannot fire a rung.
    source: mechanism_family
  - id: GR-CALENDAR-ADJUSTED
    rule: Dates and sends are counted in the market's working calendar and time zone, not in raw days,
      and a rung never lands after the date it is warning about.
    check: Every due date records the working_calendar version used and the holiday or weekend adjustment
      applied; every scheduled rung resolves to a send time inside quiet hours and before the due date.
    source: mechanism_family
  - id: GR-NO-SILENT-LAPSE
    rule: No date passes unaccounted for. Every obligation whose date has gone is either discharged
      with evidence or on the exception list with a named owner.
    check: At the end of each run, every date_register entry past its due date maps to either a completion_evidence
      record or an exception_report line naming the person it now sits with.
    source: mechanism_family
  - id: GR-EVIDENCE-NOT-ELAPSED
    rule: An obligation is closed by the evidence that discharges it, never by time passing and never
      by a reminder having been sent.
    check: A close is refused unless an artefact satisfying completion_rules is attached; delivery of
      a rung updates the ladder_log only and never the obligation's state.
    source: mechanism_family
  - id: GR-SUPPRESSION-HONOURED
    rule: A due date that is already satisfied, opted out, in dispute or suppressed generates no contact,
      and no ladder exceeds the configured frequency cap.
    check: Every rung is tested against suppression_rules and the contact and consent state before sending,
      and each suppression is written to the ladder_log with the rule that caused it.
    source: mechanism_family
  - id: GR-DEADLINE-IMMOVABLE
    rule: The unit never moves, waives, extends or restarts a statutory or contractual date. It sets
      and re-arms its own reminders and nothing else.
    check: Dates sourced from statutory_date_sets or from an agreement are written once and read thereafter;
      any change carries an actor, a reason and the authority that granted it, and raises a gate.
    source: mechanism_family
  - id: GR-CONSEQUENCE-CITED
    rule: A notice states the date, the rule that sets it and the documented consequence of missing
      it. It never tells the recipient which way to decide.
    check: Every consequence sentence in an advance_notice cites the clause, rule or statute reference
      it came from, and any choice the date forces appears in the decision_brief as options rather than
      as a recommendation.
    source: mechanism_family
  - id: GR-RUN-IS-VISIBLE
    rule: A sweep that finds nothing still reports. Silence from this unit is indistinguishable from
      a unit that has stopped running.
    check: Each scheduled sweep writes a run record with the window covered, the counts examined, actioned
      and suppressed, and delivers the exception_report even when it is empty.
    source: mechanism_family
  - id: GR-REGULATED-SURFACE
    rule: 'Regulated subject matter: the unit collects and routes, and never gives advice that a licensed
      person must give.'
    check: Outbound copy is checked against the regulator guardrails in the active country pack before
      it leaves the queue.
    source: country_pack
human_gates:
