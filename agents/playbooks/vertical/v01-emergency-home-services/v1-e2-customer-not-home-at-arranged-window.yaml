  - key: suppression_rules
    description: What stops going out to an affected record while a protocol is live -- marketing, reminders,
      review requests, automated chasers, renewals -- and what releases it again.
    resolved_by: owner
  - key: recovery_policy
    description: The rules that govern fees, waivers, refunds, gestures and guarantees for this business,
      with the clause behind each.
    resolved_by: owner
    required: true
  - key: waiver_bounds
    description: How far the unit may go inside the policy without asking, and the point past which
      every case is drafted for the owner.
    resolved_by: owner
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Emergency home services: intervals, terminology, required fields
      and statutory dates.'
    resolved_by: vertical
    required: true
  - key: payment_rails
    description: Payment rails available in this market.
    resolved_by: country_pack
  - key: published_price_book
    description: The only source of money figures this unit may quote.
    resolved_by: owner
    required: true
kpis:
  - events recognised on the first contact that carried the signal
  - clocks started from the moment of recognition rather than from first work
  - protocol steps executed in order with none skipped
  - escalations acknowledged by a named person inside the window
  - reserved decisions taken by a person rather than by the unit
  - cases decided by a cited clause rather than by judgement
  - released slots and bookings refilled the same day
  - departures from the policy taken without the owner
