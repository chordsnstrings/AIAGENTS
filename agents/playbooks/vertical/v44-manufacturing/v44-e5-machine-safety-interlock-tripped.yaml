    required: true
  - key: escalation_chain
    description: The named roles for each event class in the order they are worked, the route to each,
      the interval between attempts, the acknowledgement window, the out-of-hours position and the point
      at which the chain leaves the business.
    resolved_by: owner
    required: true
  - key: reserved_decisions
    description: Which decisions inside each protocol belong to a person, who holds each one, and what
      may and may not proceed while one is outstanding.
    resolved_by: owner
    required: true
  - key: evidence_standard
    description: What must be captured for each class of event, in what form, and how long it is retained,
      so the record still stands when an insurer, a regulator or a court reaches it in this market.
    resolved_by: country_pack
    required: true
  - key: notification_matrix
    description: Who must be told about each class of event, in what order and with what wording, and
      which of those notifications are mandatory in this market rather than discretionary.
    resolved_by: country_pack
    required: true
  - key: suppression_rules
    description: What stops going out to an affected record while a protocol is live -- marketing, reminders,
      review requests, automated chasers, renewals -- and what releases it again.
    resolved_by: owner
  - key: recognition_criteria
    description: The written list of presentations that trigger this protocol in this vertical, and
      the near-misses recorded rather than actioned.
    resolved_by: vertical
    required: true
  - key: emergency_routing
    description: The emergency number, poison line, duty authority or on-call engineer this market routes
      each condition to, with the script.
    resolved_by: country_pack
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Manufacturing: intervals, terminology, required fields and statutory
      dates.'
    resolved_by: vertical
