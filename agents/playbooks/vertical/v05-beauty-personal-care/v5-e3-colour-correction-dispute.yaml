plan:
  - id: v5-e3-s01-open_case
    name: Find or open the case
    kind: observe
    description: 'Take the inbound event and resolve it to exactly one case: match it to an open reference,
      or open a new one and issue the reference. Load the current stage, the clock already running and
      everything the case has accumulated so far.'
    produces:
      - case_file
  - id: v5-e3-s02-assemble_evidence
    name: Assemble what this stage requires
    kind: gather
    description: 'Pull the evidence the stage demands and nothing less: the agreement or quote in force,
      prior correspondence, documents, photographs, ledger lines, third-party records. Note what is
      missing and who holds it rather than working around the gap.'
    produces:
      - evidence_bundle
  - id: v5-e3-s03-test_against_terms
    name: Test the case against the terms and the clocks
    kind: assess
    description: 'Compare what you have against the stage model, the published terms and the clocks:
      what the agreement, policy or statute already says about this situation, which stage conditions
      are satisfied, what is outstanding and what is overdue. Cite the source of every position; a position
      without a citation is an opinion and does not go in the file.'
    produces:
      - outstanding_items
      - stage_clock_record
  - id: v5-e3-s04-choose_transition
    name: Choose the next stage or the gate
    kind: decide
    description: Pick the transition the stage model allows for what you found. If the outcome sits
      inside the configured authority limits, it is a transition; if it needs a concession, an exception
      or a judgement about who is right, it is a gate, and the gate is the answer rather than a delay
      to the answer.
  - id: v5-e3-s05-draft_output
    name: Draft the update and the decision pack
    kind: draft
    description: 'Write the update for the waiting party in their language: where the case is, what
      happens next, by when and what is needed from them. Where a person must decide, write the decision
      pack too -- the position under the terms with its citations, the options available, what each
      costs and the evidence behind each.'
    produces:
      - case_update
      - decision_pack
  - id: v5-e3-s06-move_the_case
    name: Move the case and re-arm the clock
    kind: act
    description: Write the transition to the case file with actor, timestamp and reason, attach the
      evidence to the stage that needed it, set the next due date and name the owner. Nothing leaves
      this step in a stage the model does not define.
    produces:
      - case_file
      - stage_clock_record
  - id: v5-e3-s07-tell_the_waiting_party
    name: Tell everyone waiting on it
    kind: notify
    description: Send the update on the configured cadence and channel, including when there is no news,
      and route the decision pack to the named contact when the case has stopped at a gate. A case that
      moved in silence has not been worked.
    produces:
      - case_update
  - id: v5-e3-s08-hold_and_chase
    name: Hold the amount and chase the missing evidence
    kind: act
    description: Place the contested amount on hold in the ledger for as long as the configured rules
      allow, chase whichever side still owes evidence on the configured interval, and keep the response
      deadline visible to the owner as it runs down.
    produces:
      - dispute_hold_record
  - id: v5-e3-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-ONE-CASE-OBJECT
    rule: Every event lands on exactly one case object. Nothing is handled off the record and no reply
      exists without a case.
    check: Before any message is sent the case reference exists, is stored against the thread and appears
      on the outbound message.
    source: mechanism_family
  - id: GR-STAGE-MODEL-ONLY
    rule: The case moves only along transitions the configured stage model defines, and only into stages
      that model names.
    check: Every transition is validated against case_stage_model before it is written; an undefined
      transition raises a gate instead.
    source: mechanism_family
  - id: GR-CLOCK-INTEGRITY
    rule: A clock starts when its stage opens and is never reset by sending a message about the case.
    check: stage_clock_record retains the original target date for every stage; each extension carries
      an actor, a reason and the authority that granted it.
    source: mechanism_family
  - id: GR-STALL-SURFACED
    rule: A case past its stage interval is surfaced before the waiting party asks about it.
    check: Every case beyond its stage_clocks interval appears in the stall output with days overdue
      and the party it waits on, dated before the next inbound chase.
    source: mechanism_family
  - id: GR-POSITION-NOT-VERDICT
    rule: 'The unit states the position existing terms already produce. It never states the outcome:
      the concession, the settlement and the closure decision belong to a person.'
    check: Every clause, rule or computed position in the draft carries a citation to its source document
      and version, and the artefact presents options rather than a determination.
    source: mechanism_family
  - id: GR-NO-SILENT-CLOSURE
    rule: A case closes only with its required evidence on file and the waiting party told it has closed.
    check: A transition into a terminal stage is refused unless evidence_requirements are satisfied
      and a closing case_update is logged as delivered.
    source: mechanism_family
  - id: GR-STATUS-NOT-CONTENT
    rule: Status is disclosed; the substance behind the status is not. Results, third-party identities
      and anything a licensed person must deliver stay out of the update.
    check: Outbound updates name the stage, the owner and the next date only; anything the disclosure
      policy reserves is withheld and routed to the named role instead.
    source: mechanism_family
  - id: GR-PUBLISHED-PRICES-ONLY
    rule: Money figures come from published pricing. The unit never invents a number.
    check: Every figure in the artefact resolves to a row in the published price book or to a quote
      already issued by the business.
    source: catalogue
