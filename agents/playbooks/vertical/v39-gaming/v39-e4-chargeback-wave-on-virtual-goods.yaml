plan:
  - id: v39-e4-s01-read_the_requirement
    name: Read the requirement from its source
    kind: observe
    description: 'Before anything is requested, establish exactly what this pack must contain: pull
      the requirement set for this pack type, corridor, standard, scheme or form from configuration,
      resolve every conditional item against the facts of this case, and fix the deadline and the acceptor''s
      format alongside it. The list comes from the authority that will judge the pack, never from what
      a similar case needed last time.'
    produces:
      - requirement_checklist
  - id: v39-e4-s02-pull_what_is_held
    name: Sweep what the business already holds
    kind: gather
    description: Search every system of record the business already has -- the document store, the case
      file, prior packs, the ledger, the media library -- and bind each existing item to the requirement
      it answers, with its version and its date. Nobody is asked for something already on file and still
      in date; a chase that re-requests held documents is the fastest way to lose the cooperation the
      rest of the pack depends on.
    produces:
      - document_register
  - id: v39-e4-s03-chase_the_gaps
    name: Request every remaining item from whoever holds it
    kind: gather
    description: 'For each item still missing, ask the party who actually holds it: name the document
      in the words they would use, say what it is needed for and by when, and give them a way to return
      it in one step rather than a list of instructions. Send from the customer''s own connected accounts,
      in the holder''s language and on the channel they already use, following the configured ladder
      and contact caps, and log every request, response and refusal against the item it concerns.'
    produces:
      - chase_log
      - gap_list
  - id: v39-e4-s04-check_each_item
    name: Check each item against the requirement it answers
    kind: assess
    description: 'Test every received item: is it the document the requirement actually asked for, issued
      by an accepted body, in date at the moment of filing rather than at the moment of receipt, legible
      and complete to the last page, correctly named, certified or translated where that is required,
      and consistent with the names, dates and figures on everything else in the pack. This is a completeness
      and currency test; whether the content is adequate, persuasive or true is not yours to judge.'
    produces:
      - completeness_report
  - id: v39-e4-s05-decide_the_pack_state
    name: Settle the pack into one of three states
    kind: decide
    description: 'Place the pack in exactly one state: complete against every mandatory item of the
      requirement, incomplete with each gap named against its holder and the time remaining, or blocked
      because the next move is a judgement -- what position to take, what to disclose, whether to contest
      or concede, whether a substitute item will do. A blocked pack goes to the named person with the
      brief attached; it is never resolved by choosing on their behalf.'
  - id: v39-e4-s06-assemble_the_pack
    name: Assemble the pack in the acceptor's own format
    kind: draft
    description: 'Compile the checked items into the layout the acceptor requires: their ordering, index
      and naming convention, their cover sheet and references, their file types and size limits, with
      cross-references between items that must agree and redactions applied so only what the requirement
      asks for leaves. Draft the covering narrative from records and approved library text, and mark
      every gap on the face of the pack rather than in a covering note nobody will read.'
    produces:
      - assembled_pack
  - id: v39-e4-s07-file_or_hold
    name: File what has been released, and hold what has not
    kind: act
    description: Once the named person has released it, lodge the pack through the acceptor's own channel
      inside the deadline, capture the reference and receipt it returns, and file both against the case.
      Where release, signature or a submission decision is still outstanding, hold the pack ready and
      keep the clock visible -- an assembled pack that was never lodged is not an outcome, and a pack
      lodged without release is not yours to send.
    produces:
      - submission_receipt
  - id: v39-e4-s08-report_the_state
    name: Report the state to everyone waiting on it
    kind: notify
    description: 'Tell the internal owner and the waiting parties where the pack stands: what is in,
      what is still out and with whom, what was rejected and why, how many days remain, and what now
      needs a person. Send the gap list on its cadence whether or not it changed, because silence from
      a document chase is indistinguishable from a chase that stopped running.'
    produces:
      - gap_list
      - handover_brief
  - id: v39-e4-s09-reconstruct_the_timeline
    name: Reconstruct the timeline from records made at the time
    kind: assess
    description: 'Build the sequence the pack rests on out of records that already existed before the
      challenge arrived: the booking, the messages, the signatures, the access and delivery logs, the
      time-stamped photographs, the ledger entries. Each point on the timeline carries the artefact
      that proves it and the system it came from, and anything the records do not support is listed
      as unsupported rather than narrated around.'
    produces:
      - evidence_timeline
  - id: v39-e4-s10-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-REQUIREMENT-IS-SOURCED
    rule: The checklist is read from the authority, standard, scheme or form that governs the pack.
      It is never recalled from a previous case or inferred from a similar one.
    check: Every requirement_checklist line carries the document_requirements id and the source reference
      it came from, with the retrieval date; a line without one cannot be marked satisfied.
    source: mechanism_family
  - id: GR-COMPLETENESS-NOT-MERITS
    rule: The unit tests presence, currency, legibility, format and internal consistency. It never rules
      on whether the content is adequate, truthful, eligible or persuasive.
    check: Each completeness_report line records a presence, validity, format or consistency result
      only; any merit question is written to the handover_brief with the person it was routed to.
    source: mechanism_family
  - id: GR-NO-DOCUMENT-MANUFACTURED
    rule: No document is created, altered, backdated, re-dated, re-signed or reconstructed. Every item
      in the pack was supplied by its holder or produced by a system of record.
    check: Each document_register entry names its supplier or source system, its receipt time and its
      unmodified checksum; any generated document is limited to an approved template populated from
      record fields and is labelled as generated.
    source: mechanism_family
  - id: GR-ASK-ONCE
    rule: Nobody is asked for an item the business already holds in a valid, in-date form.
    check: Every chase_log request is preceded by a document_register lookup recorded in the same run,
      and a request for an item already satisfied is refused and reported as a defect.
    source: mechanism_family
  - id: GR-VALIDITY-AT-FILING
    rule: An item counts as received only when it passes the validity rules, and validity is measured
      at the moment of filing rather than the moment of receipt.
    check: Each document_register entry stores the validity checks run, the rule id behind each and
      the expiry tested against the planned filing date; an item expiring before that date is returned
      to the gap_list.
    source: mechanism_family
  - id: GR-ANSWER-FROM-LIBRARY
    rule: Narrative text in a pack comes from approved library entries or from records. The unit never
      composes an answer, a figure or a characterisation the sources do not already contain.
    check: Every narrative block in the assembled_pack cites an approved answer id or the record it
      was derived from; a block with neither is held out and routed to its subject-matter owner.
    source: mechanism_family
  - id: GR-GAP-STAYS-VISIBLE
    rule: An incomplete pack is never presented as complete, and a gap is never closed by a substitute
      the requirement does not permit.
    check: The assembled_pack carries its outstanding items on its face and its state field reads incomplete
      while any mandatory item is unsatisfied; each substitution cites the acceptable_evidence rule
      that permits it.
    source: mechanism_family
  - id: GR-RELEASED-BEFORE-FILED
    rule: Nothing is lodged, submitted, signed or served until the named person has released it, and
      the receipt is kept as the proof the deadline was met.
    check: Every submission_receipt names the releasing person, the release time and the pack version
      released, and no submission exists without a matching release entry in the audit trail.
    source: mechanism_family
  - id: GR-MINIMUM-DISCLOSURE
    rule: Only what the requirement asks for leaves the business. Documents are redacted or withheld
      per the disclosure rules before a pack is sent anywhere.
    check: Each item in the assembled_pack maps to a requirement line, and the redactions applied are
      logged against document_retention_and_minimisation with the basis for each.
    source: mechanism_family
