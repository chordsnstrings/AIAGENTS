  - key: protocol_register
    description: 'Every event this business runs a protocol for: the recognition criteria that say the
      event has occurred, the fixed steps it carries in their order, and the point at which the protocol
      stops.'
    resolved_by: vertical
    required: true
  - key: statutory_clocks
    description: 'The deadlines each class of event carries in this market: what each one is measured
      from, how long it runs, the warning points before it expires and the role that owns it.'
    resolved_by: country_pack
    required: true
  - key: escalation_chain
    description: The named roles for each event class in the order they are worked, the route to each,
      the interval between attempts, the acknowledgement window, the out-of-hours position and the point
      at which the chain leaves the business.
    resolved_by: owner
    required: true
  - key: reserved_decisions
    description: Which decisions inside each protocol belong to a person, who holds each one, and what
      may and may not proceed while one is outstanding.
    resolved_by: owner
    required: true
  - key: evidence_standard
    description: What must be captured for each class of event, in what form, and how long it is retained,
      so the record still stands when an insurer, a regulator or a court reaches it in this market.
    resolved_by: country_pack
    required: true
  - key: notification_matrix
    description: Who must be told about each class of event, in what order and with what wording, and
      which of those notifications are mandatory in this market rather than discretionary.
    resolved_by: country_pack
    required: true
  - key: suppression_rules
    description: What stops going out to an affected record while a protocol is live -- marketing, reminders,
      review requests, automated chasers, renewals -- and what releases it again.
    resolved_by: owner
  - key: deadline_rules
    description: 'How each period is computed in the governing jurisdiction: what it runs from, working
      or calendar days, and how it is served.'
    resolved_by: country_pack
    required: true
  - key: docket_owners
    description: Who owns each class of deadline, the warning points before it expires and the escalation
      when a warning goes unanswered.
    resolved_by: owner
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for In-house legal & contracts: intervals, terminology, required
      fields and statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
kpis:
  - events recognised on the first contact that carried the signal
  - clocks started from the moment of recognition rather than from first work
  - protocol steps executed in order with none skipped
  - escalations acknowledged by a named person inside the window
  - reserved decisions taken by a person rather than by the unit
  - deadlines computed from the instrument's own trigger date
  - windows met with the response ready before the warning point
  - deadlines discovered only after they had run
