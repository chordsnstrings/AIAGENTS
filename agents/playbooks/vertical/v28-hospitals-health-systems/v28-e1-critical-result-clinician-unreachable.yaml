plan:
  - id: v28-e1-s01-interlock
    name: Run the safety interlock
    kind: act
    description: Recognise the condition and execute the fixed protocol steps before any commercial
      step. The interlock cannot be skipped, reordered or deferred, and no other step may run ahead
      of it.
    produces:
      - interlock_log
    interlock: true
  - id: v28-e1-s02-recognise_the_event
    name: Recognise it as the event, and stamp the time
    kind: observe
    description: 'Test what arrived against the recognition criteria in the protocol register and name
      the protocol it matches, then stamp the moment of recognition and the signal that produced it.
      The commonest failure in this whole family is a protocol event handled as an ordinary message:
      by the time somebody notices, the window has gone and the record has not been kept. Recognition
      is a test against a written list, never a judgement about how serious it looks, and where the
      signal sits close to the criteria the protocol runs and the near-match is recorded.'
    produces:
      - recognition_record
  - id: v28-e1-s03-start_the_clocks
    name: Start every clock the event carries, from recognition
    kind: act
    description: Enter every deadline this class of event carries -- statutory, contractual, insurer,
      platform, internal -- computed from the recognition timestamp rather than from the moment work
      began, each with its owner, its expiry and its warning points. Do this before the facts are gathered
      and before anybody is told, because the clock does not wait for the investigation and a deadline
      discovered late is a deadline already partly spent. A clock with no named owner is not started.
    produces:
      - clock_docket
  - id: v28-e1-s04-capture_the_facts
    name: Capture the record before anything alters it
    kind: gather
    description: Take the account, the media, the readings, the logs, the times, the people present
      and the state of things as they stand right now, in the order the evidence standard sets, and
      store each with its source and its own timestamp. Capture precedes containment, repair, tidying,
      apology and notification, because every one of those alters or destroys what you are trying to
      record. Write what was observed and by whom; cause, fault and meaning are somebody else's to supply.
    produces:
      - incident_record
  - id: v28-e1-s05-size_it_against_the_matrix
    name: Place it in the band the matrix names
    kind: assess
    description: Set what you captured against the severity matrix for this event class and record the
      band it falls in, the thresholds it crossed, which notifications that band makes mandatory rather
      than optional, and who must therefore be told and by when. The band comes from the matrix and
      from the facts, never from tone or from how upset anybody is; where the facts straddle two bands,
      the higher one is taken and the straddle is noted for the human.
    produces:
      - severity_assessment
  - id: v28-e1-s06-execute_the_fixed_steps
    name: Run the protocol's steps in its order, none skipped
    kind: act
    description: 'Work the steps the register sets for this protocol in the order it sets them, logging
      each with its time, its actor and what it returned, and switch off the outbound queues the suppression
      rules name for an affected record. The order is the protection: it is what keeps the interlock
      ahead of the booking and the evidence ahead of the repair. Where a step cannot be run, record
      what blocked it and carry it forward as open rather than passing over it, and go no further than
      the point at which the register says the protocol ends.'
    produces:
      - protocol_execution_log
  - id: v28-e1-s07-draft_what_only_a_person_may_release
    name: Prepare every reserved output completely, and hold it
    kind: draft
    description: 'Write the notifications, the statements, the acknowledgements, the regulator-format
      files and the option sets in full, so that the person deciding has to supply a decision and not
      a document. Then hold every one of them: nothing that admits, apologises for, concedes, commits
      or notifies leaves this unit on its own authority, however obviously right it looks and however
      tight the window is. Name the releaser against each draft and show the deadline it is waiting
      against.'
    produces:
      - held_drafts
  - id: v28-e1-s08-hold_the_reserved_decision
    name: Mark the boundary and let nothing past it
    kind: gate
    description: 'Name what is now waiting on a person and stop there: whether to notify, whether to
      admit, what the statement says, whether the waiver stands, whether the machine restarts, what
      the clinician does next. Each of these is the reason the gate exists, and none of them becomes
      yours because the window is closing or nobody has answered yet. Nothing behind the gate proceeds
      while it is open, and the boundary does not move -- what moves is the urgency with which you push
      it at somebody.'
  - id: v28-e1-s09-escalate_to_the_named_human
    name: Put it in a person's hands and confirm they have it
    kind: notify
    description: Deliver the pack to the role the escalation chain names, on the route it names, inside
      the window it sets, and treat the escalation as incomplete until a person has acknowledged it
      -- a delivered message is not an acknowledgement. Where the window passes, re-escalate on the
      configured fallback rather than leaving it to age, and keep the case open with its clocks visible
      on it. Anything that reaches a customer in the meantime sends from the business's own connected
      account, in the business's voice, and says only what the approved wording allows.
    produces:
      - escalation_record
  - id: v28-e1-s10-work_the_chain_in_order
    name: Work each name on its route, at the stated interval
    kind: act
    description: 'Contact each name in the order the chain sets, on the route it sets, and move to the
      next only when the stated interval has passed with no acknowledgement -- not sooner because it
      feels urgent and not later because the last attempt is still ringing. Log every attempt with its
      time, route, duration and result, including the ones that went nowhere. A delivery receipt is
      not an acknowledgement: the chain advances on a person answering and on nothing else.'
    produces:
      - cascade_log
  - id: v28-e1-s11-raise_it_when_the_list_runs_out
    name: Escalate past the last name rather than stopping
    kind: gate
    description: When the chain is exhausted, raise the threshold contact the protocol names -- the
      out-of-hours contact, the duty manager, the designated authority -- at the point it names and
      not one attempt later, and keep the case open until a person has acknowledged it in writing. An
      exhausted chain with nobody on the end of it is the failure this profile exists to prevent, and
      it is never treated as an outcome.
    produces:
      - acknowledgement_record
  - id: v28-e1-s12-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
  - id: v28-e1-s13-stop
    name: Stop at the human gate
    kind: stop
    description: Hand the situation to the named human contact and stop. The unit does not resolve,
      clear or close the underlying condition under any circumstances.
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-CLOCK-RUNS-FROM-RECOGNITION
    rule: Every deadline is computed from the moment the event was recognised, never from the moment
      work started on it.
    check: recognition_record carries the recognition timestamp and the signal behind it, and every
      entry in clock_docket resolves to a rule in statutory_clocks computed from that timestamp with
      a named owner.
    source: mechanism_family
  - id: GR-CAPTURE-BEFORE-ALTERATION
    rule: The record is captured before any step that could alter the scene, the system, the account
      or the account of it.
    check: incident_record timestamps precede every containment, repair, reset or notification entry
      in protocol_execution_log, and its contents meet evidence_standard for this event class.
    source: mechanism_family
  - id: GR-STEPS-IN-ORDER-NONE-SKIPPED
    rule: Protocol steps run in the order written. A step that cannot be run is recorded as blocked
      and carried forward, never skipped.
    check: protocol_execution_log holds one entry per step of the protocol_register sequence in that
      order, and every incomplete step names what blocked it and remains open.
    source: mechanism_family
  - id: GR-ESCALATION-IS-THE-PRODUCT
    rule: The run is complete when a named person is holding the case, not when the steps have been
      ticked.
    check: escalation_record shows acknowledgement by a role named in escalation_chain; an unacknowledged
      escalation re-escalates on the configured fallback and the case stays open.
    source: mechanism_family
  - id: GR-DRAFTS-STAY-HELD
    rule: Notifications, statements, admissions and commitments are prepared complete and never leave
      on the unit's authority.
    check: Every item in held_drafts carries a held state and a named releaser drawn from reserved_decisions;
      no send is logged against a reserved output before its gate resolves.
    source: mechanism_family
  - id: GR-NO-CAUSE-NO-ADMISSION
    rule: The record states what was observed, when and by whom. It never states cause, fault, liability
      or apportionment.
    check: incident_record and every outbound draft are free of causal claims, admissions and apportionment;
      the determination fields are left empty for the named human.
    source: mechanism_family
  - id: GR-SUPPRESS-WHILE-LIVE
    rule: Automated outbound to an affected record stops while the protocol is live, and only a person
      releases it.
    check: Suppression is applied at recognition to every queue named in suppression_rules, protocol_execution_log
      names each queue suppressed, and every release records the person who made it.
    source: mechanism_family
  - id: GR-SAFETY-INTERLOCK
    rule: 'Safety-critical protocol: recognition and routing only. The unit recognises the condition,
      executes the fixed steps and stops at the human gate. It never resolves the underlying situation.'
    check: Interlock steps run first and cannot be skipped, reordered or deferred; the plan terminates
      in a gate or stop step, never in a resolution.
    source: catalogue
