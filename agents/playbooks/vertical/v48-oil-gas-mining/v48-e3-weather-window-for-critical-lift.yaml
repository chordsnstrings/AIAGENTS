  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: capacity_model
    description: What a unit of capacity is for this business -- a slot, a chair, a bay, a bed, a seat,
      a table, a crew-hour, a vehicle-day -- how many exist per resource and window, and the overbooking
      allowance, if any, that may be committed beyond the nominal count.
    resolved_by: vertical
    required: true
  - key: booking_rules
    description: 'Per service or job type: duration, setup and clean-down, the buffer either side, minimum
      notice, booking horizon, cut-off, and the cancellation and change windows the published terms
      allow.'
    resolved_by: vertical
    required: true
  - key: resource_eligibility
    description: 'Which resources may take which work: the skills, grades, licences, certifications,
      languages, equipment and site access each job requires, and the pairings the business forbids.'
    resolved_by: vertical
    required: true
  - key: priority_policy
    description: How competing demands are ranked when capacity is short -- urgency, clinical or statutory
      need, contract, tier, value, order of arrival -- and the tie-breaks that go to a person instead
      of being ranked.
    resolved_by: owner
    required: true
  - key: working_calendar
    description: Opening hours, shift patterns, public holidays, seasonal closures, time zone and quiet
      hours for this market. Every window offered and every message sent is adjusted against it first.
    resolved_by: country_pack
    required: true
  - key: change_notification_rules
    description: Who must be told when a committed time moves, how far ahead, on which channel, and
      what the published terms owe the affected party when the business is the one that moved it.
    resolved_by: owner
    required: true
  - key: dependency_rules
    description: 'What depends on what: the lead and lag between stages, the work that cannot start
      until a predecessor is complete, and how far a change propagates downstream before it needs a
      decision.'
    resolved_by: vertical
    required: true
  - key: disruption_policy
    description: The order in which commitments are protected when capacity collapses, the goodwill
      and compensation the published terms permit, and who must be told within what window.
    resolved_by: owner
    required: true
  - key: forecast_thresholds
    description: The weather, traffic and condition feeds used in this market and the thresholds at
      which work is held, moved or re-sequenced rather than attempted.
    resolved_by: country_pack
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Oil, gas & mining: intervals, terminology, required fields and
      statutory dates.'
    resolved_by: vertical
    required: true
kpis:
  - bookable capacity that converted into a confirmed commitment
  - collisions that reached a customer rather than being caught at the hold
  - freed capacity refilled before its window passed
  - commitments that started inside the window given
  - schedule changes broadcast inside the notice period owed
  - conflicts handed to a named person rather than absorbed silently
  - affected parties re-timed before their original window passed
  - displaced commitments still unplaced at the end of the run
  - delay notices filed on the day the event occurred
