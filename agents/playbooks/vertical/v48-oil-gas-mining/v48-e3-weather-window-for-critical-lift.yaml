plan:
  - id: v48-e3-s01-read_the_diary
    name: Read the live diary and what has just changed in it
    kind: observe
    description: 'Take the demand event or the sweep window, then read the diary as it stands right
      now: every resource in scope with the hours it works, what is already committed against it, what
      is on hold, and what is blocked by absence, closure, overrun or travel. Stamp each read with its
      time -- availability you cached earlier in the conversation is not availability.'
    produces:
      - capacity_ledger
  - id: v48-e3-s02-load_the_constraints
    name: Load everything the work has to fit inside
    kind: gather
    description: 'Assemble the envelope before judging any slot: the duration, setup and clean-down
      and buffer the job type carries, the skills, licences, equipment and site access it needs, the
      parties who must be present and their own availability, the travel between it and whatever sits
      either side of it, and the requester''s stated preferences, constraints and contact state.'
    produces:
      - constraint_set
  - id: v48-e3-s03-test_the_fit
    name: Test each candidate window against the whole envelope
    kind: assess
    description: Compute what is genuinely free -- nominal capacity less what is committed, held and
      unavailable -- and test every candidate window against each constraint in turn, including the
      collision check against anything already in that resource's day. A window that fails one constraint
      is not a window; show which constraint removed it, because an option nobody can explain will be
      overridden by somebody who can.
    produces:
      - capacity_ledger
      - conflict_report
  - id: v48-e3-s04-rank_and_choose
    name: Rank what fits, and name what would have to move
    kind: decide
    description: Rank the surviving options by the configured priority policy and pick the one to offer.
      Where nothing fits, work out what would have to move to make room, what that costs the party holding
      it and what the published terms owe them -- and stop there. Which commitment gets displaced, and
      whose claim outranks whose, is a person's decision and it is raised as a gate with the ranked
      options attached.
  - id: v48-e3-s05-draft_the_offer
    name: Draft the offer or the assignment, and the trade-off brief
    kind: draft
    description: 'Write real times rather than an invitation to get in touch: the window, the named
      resource, what the party needs to bring or do beforehand, and the way to change or cancel it under
      the published terms. Where a person must choose between commitments, draft the brief alongside
      -- the options, who each one affects, what it costs and by when the choice has to be made.'
    produces:
      - offer_set
      - trade_off_brief
  - id: v48-e3-s06-commit_and_confirm
    name: Write the commitment, then confirm it
    kind: act
    description: 'Write the booking or assignment to the diary first and confirm it second, never the
      other way round: the collision-checked write under the hold is what makes it real, and a write
      that does not return leaves the party unbooked rather than quietly confirmed. The confirmation
      sends from the customer''s own connected accounts and carries the window, the named resource,
      the reference and how to change it.'
    produces:
      - booking_record
      - change_log
  - id: v48-e3-s07-broadcast_the_change
    name: Tell everyone the schedule touches, then report the run
    kind: notify
    description: 'Push the result to every party it lands on -- the requester, the assignee or crew,
      the parties downstream whose own timing just moved -- inside the notice period the rules set,
      with the reason when a committed time changed. Send the run''s exception list alongside: capacity
      still unfilled, work still uncovered, collisions unresolved and constraints breached, each with
      the named person it now sits with.'
    produces:
      - change_log
      - conflict_report
      - utilisation_report
  - id: v48-e3-s08-close_out_the_displaced
    name: Account for every commitment the disruption touched
    kind: assess
    description: 'Sweep the displaced list before you finish: each commitment the event touched now
      holds a new confirmed time, an agreed credit from the published terms, or a line on the exception
      list with the person it sits with. Write the delay notice alongside it -- what happened, when
      it became known, what moved as a result and the consequence the contract already documents --
      because a disruption nobody recorded on the day cannot be evidenced when it is later claimed against.'
    produces:
      - displacement_register
      - disruption_notice
  - id: v48-e3-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-NO-DOUBLE-COMMIT
    rule: No resource is committed to two things at once. Every write passes a collision check against
      the live diary, under a hold, before anything is confirmed.
    check: Each booking_record carries the hold id, the collision check result and the diary version
      it was written against; a write that does not return leaves the record unconfirmed and on the
      conflict_report.
    source: mechanism_family
  - id: GR-AVAILABILITY-IS-LIVE
    rule: Times are offered from availability read live, never from a cached view, and re-read at the
      instant of commitment.
    check: Every entry in an offer_set records the capacity_ledger read timestamp behind it; an offer
      built on a read older than the configured staleness window is refused and rebuilt.
    source: mechanism_family
  - id: GR-CONSTRAINTS-BEFORE-OFFER
    rule: A window reaches a customer only after it has satisfied every constraint -- duration, buffer,
      travel, eligibility, equipment, access and required attendees.
    check: Each offered window lists the constraint_set items it satisfies and the eligibility rule
      that qualified the resource; an unevaluated constraint blocks the offer rather than warning on
      it.
    source: mechanism_family
  - id: GR-NO-UNILATERAL-DISPLACEMENT
    rule: The unit never moves, bumps, shortens or cancels a commitment somebody already holds on its
      own authority. It drafts the options and the gate decides.
    check: Any change to an existing commitment carries a gate resolution id or an explicit rule in
      disruption_policy or priority_policy that permitted it; the trade_off_brief exists before the
      change does.
    source: mechanism_family
  - id: GR-CAPACITY-NOT-INVENTED
    rule: 'The unit never creates capacity that does not exist: no overbooking beyond the configured
      allowance, no double-manning a resource, no compressing a job below its configured duration.'
    check: Committed load per resource and window is tested against capacity_model, including its overbooking
      allowance, before each write; every job holds at least its configured duration plus buffer.
    source: mechanism_family
  - id: GR-CHANGE-IS-BROADCAST
    rule: No committed time changes silently. Every party a change touches is told, with the new time
      and the reason, inside the notice period the rules set.
    check: Each change_log entry maps to a delivered message per recipient required by change_notification_rules,
      with the interval between the notice and the original time recorded.
    source: mechanism_family
  - id: GR-FAIR-ORDER
    rule: Openings and priority are worked in the configured order. Any departure from it is recorded
      with the rule that permitted it, never with a judgement about the parties.
    check: Every offer and assignment records the waitlist_order or priority_policy position it came
      from; a position passed over without a named rule raises a conflict_report line.
    source: mechanism_family
  - id: GR-NO-SILENT-IDLE
    rule: Capacity that comes free is either refilled, deliberately left open, or reported. It never
      simply lapses unnoticed.
    check: Each run reconciles freed capacity against offers made and outcomes recorded, and the utilisation_report
      ships even when the day filled itself.
    source: mechanism_family
