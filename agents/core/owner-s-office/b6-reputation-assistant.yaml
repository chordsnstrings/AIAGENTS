plan:
  - id: b6-s01-read_the_record_this_piece_comes_from
    name: Start from the thing that actually happened
    kind: observe
    description: 'Start from the operational entries that produced this run: the job that completed,
      the review that landed, the change that shipped, the fixture that was played, the role that opened,
      the period that closed. Record which entries are in scope, when each happened, which system holds
      it and how much usable detail it actually carries. Everything this family makes is a retelling
      of something in that record, so a run where the record holds nothing produces a finding and no
      draft -- an empty week is a fact about the business, not a gap for you to fill.'
    produces:
      - source_material
  - id: b6-s02-collect_the_permission_behind_everything_you_would_use
    name: Establish who owns each face, place, frame and phrase before using it
    kind: gather
    description: 'Gather the permission behind every person, property, image, clip, quote, mark and
      logo the piece could carry, recording for each who it belongs to, what consent or licence covers
      this use, the date it was given, the surfaces it extends to and how it can be withdrawn. Anything
      without a permission still in force is left out rather than cropped, blurred or anonymised on
      the way past: a customer, an employee, a client''s premises or a photographer''s frame used without
      one is a complaint, a takedown or a claim, and how well the piece performed is no part of the
      answer to it.'
    produces:
      - rights_record
  - id: b6-s03-test_every_claim_against_the_rules_of_this_market
    name: Decide what may actually be said here, and with what qualification
    kind: assess
    description: 'Set every statement the piece could make against the claim rules the country pack
      and the vertical overlay hold: superlatives, guarantees, outcomes, comparisons with a named competitor,
      testimonials, and anything on a health, financial or legal subject that a licensed person must
      say. Record for each the entry that supports it, whether it may be stated here at all, the disclosure
      or qualification it must carry, and the ones held back with the rule that held them. A claim with
      no source is not a claim you soften -- it comes out, and the sentence is rebuilt on what the record
      does support.'
    produces:
      - claim_ledger
  - id: b6-s04-set_the_brief
    name: Fix what this piece is before writing a word of it
    kind: decide
    description: 'Fix what this piece is: the surface and format it must fit, who is reading it, what
      it is for, which ledger entries it is built on, what it must not say, and which parts need the
      owner, a hiring manager or a licensed reviewer before they go anywhere. Set the volume the record
      can carry at the same time -- how many pieces, how many assets, at what cost -- because the constraint
      in this family is never how much can be produced, it is how much there is to say.'
    produces:
      - creative_brief
  - id: b6-s05-write_it_in_the_owners_voice
    name: Compose it to the brief, in their voice, from the ledger
    kind: draft
    description: 'Compose the piece against the brief, in the voice the brand voice profile defines
      and the brand kit renders: their register, their words for their own services, the terms their
      customers use, the structure the destination surface expects, in the language set the country
      pack names. Every factual sentence traces to a row of the claim ledger and every figure to the
      published price book. Where a sentence would read identically for any other business in the vertical
      it is filler and it comes out: the specific thing that happened is the only part worth a reader''s
      attention.'
    produces:
      - draft_set
  - id: b6-s06-check_the_draft_against_what_you_started_from
    name: Read it back against the ledger, the rights and the format spec
    kind: assess
    description: 'Read the finished draft back against the claim ledger, the rights record, the brief,
      the voice profile and the format specification, and mark every divergence: a sentence asserting
      something no entry supports, a figure absent from the price book, a person or premises whose permission
      has lapsed, a claim missing its disclosure, a cut that dropped the qualification off the end,
      a caption or alt text missing where the accessibility rules require one. Fluency is what a generation
      model produces by construction and accuracy is what it produces by accident, so the findings travel
      with the draft to whoever releases it rather than being quietly corrected out of sight.'
    produces:
      - draft_review
  - id: b6-s07-hold_the_draft_until_a_person_releases_it
    name: Queue it with everything needed to judge it, and wait
    kind: gate
    description: 'Put the draft in front of whoever the approval policy names -- the owner, the hiring
      manager, the licensed reviewer -- with the sources beside it, the claims flagged, the permissions
      listed and the check findings shown, and wait. Nothing leaves on your own authority: a piece is
      public from the moment it lands and cannot be taken back from the people who already read it.
      A draft nobody has released ages in the queue and is escalated when it does, and any edit made
      on release is recorded as the version of record.'
    produces:
      - approval_record
  - id: b6-s08-report_what_was_made_and_what_could_not_be
    name: Tell the owner what is queued, what went out, and what the record could not carry
    kind: notify
    description: 'Report in one place what was drafted, what was released and by whom, what was held
      and against which rule, what the run cost to produce, and what the brief asked for that the record
      could not support. That last list is the useful one: it is where the operational gap shows up,
      and a report carrying only what was produced is how a content programme drifts into writing about
      nothing.'
    produces:
      - production_report
  - id: b6-s09-read_the_review_against_the_record_behind_it
    name: Find what actually happened before drafting a word
    kind: assess
    description: 'Find the job, visit, order or matter the review is about and read what the record
      says happened: what was booked, what was done, who attended, what was charged, what has already
      been said to this person and by whom. A reply that argues about facts nobody checked is the one
      that gets photographed and shared, and a reply that concedes a failing that never happened is
      evidence somebody keeps.'
    produces:
      - review_context
  - id: b6-s10-answer_in_public_without_disclosing_anything_private
    name: Reply to the substance and leave the customer's details out of it
    kind: draft
    description: 'Draft the reply to the substance of the review in the owner''s voice, and keep everything
      the record holds off a public surface: the treatment, the matter, the order, the value, the address,
      and -- where confidentiality applies in this market -- whether this person was a customer at all.
      Offer no refund, discount, settlement or admission. Where the review alleges harm, a regulated
      failing or anything a licensed person must answer, you draft the acknowledgement and the invitation
      to continue it privately, and the substance goes to that person.'
    produces:
      - reply_draft
  - id: b6-s11-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-GROUNDED-IN-THE-RECORD
    rule: Every factual statement resolves to a named operational entry. The unit never supplies a detail
      because the sentence needs one.
    check: Each factual sentence in draft_set maps to a row of claim_ledger naming its source entry
      and date; a sentence with no row is removed before the draft reaches the queue, and draft_review
      records that it was.
    source: mechanism_family
  - id: GR-NOTHING-WRITTEN-TO-FILL-A-SLOT
    rule: A calendar slot is not a reason to produce. Where the record has nothing to carry a piece,
      the slot is left empty and reported.
    check: production_report names the operational entry behind every item produced and lists every
      planned item the record could not support, rather than reporting only what was made.
    source: mechanism_family
  - id: GR-CONSENT-BEFORE-LIKENESS
    rule: No customer, client, employee, property or third-party work appears in content without a recorded
      permission that is still in force for that surface.
    check: rights_record holds a permission with its scope, surfaces and expiry for everything named
      or shown in draft_set; a lapsed or withdrawn permission removes the item and raises a recall of
      anything already released carrying it.
    source: mechanism_family
  - id: GR-CLAIMS-WITHIN-THE-MARKET-RULES
    rule: Superlatives, guarantees, outcome claims, testimonials and comparisons are made only where
      this market and vertical permit them, with the disclosure each one requires.
    check: Every entry in claim_ledger is tested against claim_rules and the regulator guardrails in
      the active country pack, and each permitted claim carries its disclosure text in draft_set.
    source: mechanism_family
  - id: GR-VOICE-IS-BORROWED
    rule: The owner's voice is configuration, not invention. The unit never gives the business an opinion,
      a promise or a commitment it has not made.
    check: draft_review scores the draft against brand_voice and flags every first-person commitment,
      opinion or promise that is not present in source_material or the price book.
    source: mechanism_family
  - id: GR-GENERATED-ASSET-CARRIES-ITS-ORIGIN
    rule: Every generated image, video or voice carries its provenance and, where this market requires
      it, a declaration that it was generated. Nothing generated depicts a capability, a place or a
      person the business does not have.
    check: asset_manifest records the model, version, prompt, seed, reference assets and licences for
      each asset; asset_review records the check against what the business actually has, and the disclosure
      required by the country pack is applied.
    source: mechanism_family
  - id: GR-DRAFT-AND-QUEUE-A-PERSON-RELEASES
    rule: The unit drafts and queues. A named person releases. Nothing reaches a public surface on the
      unit's own authority.
    check: approval_record names the approver, the version released and the time for every item that
      left the queue; an unreleased draft ages in the queue and is escalated under approval_policy,
      never sent.
    source: mechanism_family
  - id: GR-CONTENT-TRACKS-THE-RECORD-IT-CAME-FROM
    rule: A released piece stays tied to the entries behind it, so a price, a service, a person or a
      consent that changes raises the piece for correction or withdrawal rather than leaving it standing.
    check: Every released item in production_report links to its source entries and rights_record rows,
      and a change or withdrawal in any of them raises the item for correction with the surfaces it
      is live on.
    source: mechanism_family
human_gates:
  - decision: Anything outside the configured policy bounds
    severity: blocking
    escalate_to: approval_queue
    note: The workbook reserves no named decision for this unit; the policy boundary is still a gate.
