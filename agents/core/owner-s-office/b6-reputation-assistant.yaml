  - key: brand_voice
    description: 'The owner''s voice held as configuration: the samples behind it, the register and
      vocabulary, the words they use for their own services, and the phrasing they never use.'
    resolved_by: owner
    required: true
  - key: brand_kit
    description: The marks, palette, type, imagery rules and legal marks every visual asset is built
      to, the formats each surface takes, and who may vary any of it.
    resolved_by: owner
    required: true
  - key: grounding_sources
    description: Which operational systems may become content in this vertical, which of their fields
      may be used, and which never leave the building.
    resolved_by: vertical
    required: true
  - key: claim_rules
    description: 'What may be claimed in this market: superlatives, guarantees, outcome and comparative
      claims, testimonials and endorsements, with the disclosure or qualification each permitted claim
      must carry.'
    resolved_by: country_pack
    required: true
  - key: consent_policy
    description: What permission a customer, client, employee or property must have given before appearing
      in content, how it is evidenced, how long it lasts, and what happens to material already out when
      it is withdrawn.
    resolved_by: owner
    required: true
  - key: approval_policy
    description: Who releases which kind of piece, how long the queue waits for them, and what becomes
      of a draft nobody released.
    resolved_by: owner
    required: true
  - key: reply_policy
    description: How quickly each review surface is answered, who signs the reply, what may be offered
      in public and what must be taken private.
    resolved_by: owner
    required: true
  - key: confidentiality_rules
    description: What this market and vertical forbid disclosing about a named individual in public,
      including whether the business may confirm they were a customer.
    resolved_by: country_pack
    required: true
kpis:
  - drafted statements traceable to a named record entry
  - drafts released by their named approver without a substantive rewrite
  - time from the source event to a draft sitting in the queue
  - assets carrying a complete consent, licence and generation provenance
  - released items later corrected or withdrawn for something the draft asserted
  - reviews answered inside the configured window
  - replies released without a rewrite by the owner
  - replies disclosing something about a named individual that should not have been public
