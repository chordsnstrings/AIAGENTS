    format: record
    retained: true
  - key: touch_log
    name: Touch log
    description: Every touch attempted with channel, timestamp, sending account, delivery state and
      whatever came back.
    format: log
    retained: true
  - key: consent_state
    name: Consent and suppression state
    description: The consent basis, opt-out state and suppression flags as they stood at the moment
      of each send, not at enrolment.
    format: record
    retained: true
  - key: sequence_outcome
