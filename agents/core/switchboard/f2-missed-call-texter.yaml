config_keys:
  - key: language_set
    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: telephony_numbers
    description: 'The business''s own numbers: which line carries which service and hours, the caller
      identity each one presents, and the registration state each needs to originate voice or text in
      this market.'
    resolved_by: owner
    required: true
  - key: call_recording_policy
    description: Whether calls may be recorded or transcribed in this market, whose consent that requires,
      what must be announced before it starts and how a refusal is honoured.
    resolved_by: country_pack
    required: true
  - key: voice_disclosure
    description: What the caller must be told about speaking to an automated assistant, at what point
      in the call, and in which languages.
    resolved_by: country_pack
    required: true
  - key: recording_retention
    description: How long audio and transcripts are held, what must be redacted from them before storage,
      and how a caller's erasure request is served.
    resolved_by: country_pack
    required: true
  - key: call_outcome_map
    description: The outcome codes a call may be closed under and the next action each one triggers
      -- booking, call-back, quote request, transfer, gate or close.
    resolved_by: owner
    required: true
  - key: hold_and_transfer_limits
    description: Longest silence, longest hold and longest queue this channel tolerates, who a live
      call may be transferred to by hour and skill, and the fallback when each limit is reached.
    resolved_by: owner
    required: true
  - key: text_back_window_seconds
    description: Seconds from the ring ending within which the first reply must leave, by line and by
      hour.
    resolved_by: owner
    required: true
    default: 60
  - key: missed_call_scope
    description: Which events count as recoverable -- ring-out, abandon in queue, voicemail, out-of-hours
      -- and which numbers and callers are excluded from an automatic reply.
    resolved_by: owner
    required: true
  - key: recovery_attribution_window
    description: How long after a missed call an enquiry may still be attributed to it before the link
      is no longer honest.
    resolved_by: owner
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
kpis:
  - telephony events that produced a record, including the ones nobody answered
  - seconds between the event and the first response the caller experienced
  - identifiers and figures written after a read-back rather than a guess
  - call outcomes reaching the system of record without a person retyping them
  - commitments made on a call that a human later found unrecorded
  - seconds from ring-out to the first reply landing
  - unanswered calls that produced a reply at all
  - enquiries recovered, and what they were worth
  - recoveries tied to a specific missed call rather than assumed
