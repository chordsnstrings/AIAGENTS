plan:
  - id: e6-s01-take_delivery_of_the_media
    name: Enumerate everything that arrived, before looking at any of it
    kind: observe
    description: 'List every image, video, frame and accompanying document that arrived for this assessment
      before you read anything into them: file, format, dimensions, duration, the capture time the file
      itself carries rather than the time it reached you, the device or account it came from and who
      supplied it. Count what arrived against what was asked for. An item with no timestamp of its own
      is recorded as undated rather than dated by its arrival, and a set you never enumerated cannot
      be shown to have been complete when a dispute reaches it eighteen months later.'
    produces:
      - media_manifest
  - id: e6-s02-bind_each_item_to_its_record
    name: Bind every item to its record, on evidence
    kind: gather
    description: 'Bind each item to the record it belongs to -- the job, the visit, the claim, the property,
      the lot, the part, the stage -- using the binding rules the configuration sets, and record the
      evidence for every binding: the reference in the request, the location tag, the capture time against
      the visit window, the label or asset tag in frame. Capture the consent state that already exists
      for each item at the same moment, because it governs everything that can be done with it afterwards.
      An item that binds to nothing goes on the unbound list with the reason and waits for a person:
      a photograph attached to the nearest plausible record is worse than one nobody filed, because
      it will be believed.'
    produces:
      - provenance_record
  - id: e6-s03-grade_the_capture_before_the_subject
    name: Grade the images before you read them
    kind: assess
    description: 'Test whether these images can carry the assessment being asked of them before you
      read anything into them: resolution, focus, exposure, framing, obstruction, whether a scale reference
      is in frame, and which of the views the capture specification requires are present, missing or
      unusable. Mark the unusable ones and say why in terms the person who took them can act on. A confident
      finding drawn from an image that could never have supported one is the characteristic failure
      of this work, and it is undetectable downstream: by the time it reaches a quote or a payment it
      reads exactly like a good finding.'
    produces:
      - capture_assessment
  - id: e6-s04-read_what_is_visible_against_the_reference
    name: Say what is visible, and where, and against which line
    kind: assess
    description: 'Read each usable item against the reference the configuration names -- the severity
      scale, the checklist line, the standard, the planogram, the catalogue entry, the specification,
      the previous capture -- and record findings one at a time: what is visible, in which item, in
      which region of the frame, which reference line it answers and how sure you are. Describe, and
      do not interpret. ''Panel deformed across roughly a third of its area, rear near-side door, image
      4 of 9, high confidence'' is a finding; ''minor damage, cheap to fix'' is two judgements the photograph
      never contained. Any reference line the images do not reach is recorded as unanswered rather than
      left out.'
    produces:
      - visual_findings
  - id: e6-s05-decide_what_may_be_stated
    name: Sort findings by what the images will actually bear
    kind: decide
    description: 'Sort every finding against the configured confidence thresholds into three groups
      and record which threshold produced each answer: what may be stated as observed, what is carried
      as undetermined until better images arrive, and what goes to a named human whatever the confidence
      because its class always does. A finding below the threshold is never rounded up into a statement,
      and undetermined is a real answer rather than a failure to produce one -- it is the line that
      stops somebody pricing, paying, ordering or dispatching against a guess.'
    produces:
      - confidence_decision
  - id: e6-s06-write_the_assessment
    name: Write it so every line walks back to an image
    kind: draft
    description: 'Write the output in the shape the record needs -- a filed and tagged set, a scored
      checklist, a scoped draft, a period report, a tiered lot, a ranked match -- with every line carrying
      the item it came from, the region within it, the reference line it answers and its confidence.
      Keep the undetermined findings and the missing views in the body of the document rather than in
      a footnote nobody reads. Nothing about price, cause, fault, cover, safety or compliance enters
      the draft: those belong to the estimator, the adjuster, the inspector or the owner, and what you
      are writing is the thing they decide from.'
    produces:
      - assessment_record
  - id: e6-s07-file_the_media_and_the_findings
    name: File the originals untouched, work on copies
    kind: act
    description: Write the originals, the derivatives you generated and the findings against the record,
      keeping every original unaltered beside any annotated, cropped or enhanced copy and recording
      which transformation produced which derivative. Apply the redaction the configuration requires
      -- faces, plates, documents and bystanders who never agreed to be in frame -- to the derivatives
      rather than to the originals, and start the retention clock the market sets. The original is the
      evidence; once it has been annotated over, whatever the image would have shown a reviewer is gone
      for good.
    produces:
      - filed_media_set
  - id: e6-s08-hand_it_over_with_the_gaps_named
    name: Hand it over naming the gaps and the exact shot that fixes them
    kind: notify
    description: 'Tell whoever asked what was produced and, in the same breath, what could not be assessed
      and precisely which shot would settle it: which view, of what, from where, at what distance, in
      what light. A request that says ''photos unclear'' reliably produces another set of unclear photos.
      Where the assessment feeds somebody''s decision -- a price, a payment, a dispatch, an order, a
      bid -- state which lines are observed and which are undetermined, so a gap in the evidence is
      never read as a clean result.'
    produces:
      - assessment_handover
  - id: e6-s09-pair_the_before_with_the_after
    name: Pair the shots and hold them to the business's own standard
    kind: assess
    description: 'Pair each ''after'' with the ''before'' of the same job taken from the same vantage
      point, and hold the pair to the standard the owner would want their name on: comparable angle
      and light, the work plainly visible, and nothing in frame that identifies a customer, a child,
      a plate, a door number, a document or a security arrangement. A pair that only works because the
      ''before'' was badly lit is not a portfolio entry, and a striking photograph of somebody''s front
      door is not one either.'
    produces:
      - portfolio_candidates
  - id: e6-s10-hold_for_consent_and_the_owner_s_pick
    name: Hold for scoped consent and the owner's pick
    kind: gate
    description: 'Hold every candidate until two things exist: consent covering this specific use, recorded,
      dated, scoped and revocable, and the owner''s own selection of which pairs represent the business.
      Consent to photograph a job is not consent to show it, and a consent given for a case file is
      not a consent for a storefront -- where the record carries only the first, ask for the second
      in writing. Anything missing either stays in the candidate list indefinitely.'
    produces:
      - consent_record
  - id: e6-s11-place_the_entry_on_the_customer_s_own_surfaces
    name: Publish from the customer's own accounts, never from ours
    kind: act
    description: Take the pairs the owner selected at the gate and publish them to the customer's own
      website, storefront and connected profiles under the grants held for those accounts, in the business's
      own voice, with the caption naming the work rather than the client. The platform never posts from
      an account it owns. Record where each entry went and keep the link, so a later withdrawal of consent
      can be executed everywhere the pair reached rather than only where it was first placed.
    produces:
      - portfolio_entry
  - id: e6-s12-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-VISIBLE-NOT-INFERRED
    rule: The unit reports what is visible and the reference line it answers. It never states price,
      cause, fault, cover, safety or a compliance verdict from a photograph.
    check: Every line of visual_findings and assessment_record cites an item, a region and a reference
      line; no line asserts a cost, a cause, a liability or a clearance the named reference does not
      carry.
    source: mechanism_family
  - id: GR-CAPTURE-GRADED-FIRST
    rule: The images are graded for whether they can support the assessment before the subject is read.
    check: capture_assessment is produced before visual_findings and marks every view in capture_specification
      present, missing or unusable; no finding cites an item graded unusable.
    source: mechanism_family
  - id: GR-UNDETERMINED-SURVIVES
    rule: '''Cannot be determined from these images'' is a first-class result and reaches the recipient
      intact.'
    check: confidence_decision classifies every finding against a named threshold, and each undetermined
      line appears in the body of assessment_record and in assessment_handover with the shot that would
      resolve it.
    source: mechanism_family
  - id: GR-BINDING-ON-EVIDENCE
    rule: An item is bound to a record on stated evidence or it is not bound at all. Nothing is filed
      against the nearest plausible match.
    check: provenance_record carries the binding evidence for every bound item and lists the unbound
      ones with a reason; bindings resolve to record_binding_rules.
    source: mechanism_family
  - id: GR-ORIGINAL-IS-PRESERVED
    rule: Originals are retained unaltered with their metadata. Annotation, cropping, enhancement and
      redaction happen on derivatives.
    check: filed_media_set holds an unaltered original for every derivative with the transformation
      recorded, and the redaction media_retention requires is applied to derivatives before any item
      leaves the record.
    source: mechanism_family
  - id: GR-CONSENT-SCOPED-TO-USE
    rule: An image is used beyond the job it was taken for only under consent scoped to that use. Consent
      to photograph is not consent to show.
    check: Every item re-used for a portfolio, a listing, a report or a case resolves to a consent entry
      naming that use, its date and its withdrawal route, per media_consent_policy; withdrawal removes
      it from every surface it reached.
    source: mechanism_family
