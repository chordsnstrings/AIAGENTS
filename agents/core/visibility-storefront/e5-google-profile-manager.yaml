plan:
  - id: e5-s01-read_the_source_of_truth
    name: Take the canonical values from the systems that own them
    kind: observe
    description: 'Take each value this run may publish from the system of record that owns it -- the
      business profile, the service list, the diary, the published price book -- with its version, the
      time it was read and the effective date of any change carried by the trigger. Where the record
      is missing, ambiguous or contradicted by another system, that is the finding: you raise it and
      publish nothing, because a surface confidently repeating the wrong hour or the wrong figure is
      worse than one that is merely out of date.'
    produces:
      - source_of_truth_snapshot
  - id: e5-s02-read_every_connected_surface
    name: Read what each surface actually says, and the grant it is read under
    kind: gather
    description: Read the current live state of every surface in scope through the customer's own grant,
      and record for each one what it holds, when it was read, the grant's scope and expiry, and whether
      it answered at all. A surface that did not answer is recorded as unverified rather than assumed
      correct, and a grant that has lapsed or been narrowed is raised as a blocked surface rather than
      quietly skipped -- the two look identical from the outside and only one of them is harmless.
    produces:
      - surface_inventory
  - id: e5-s03-diff_the_surfaces_against_the_truth
    name: Compare field by field and classify every divergence
    kind: assess
    description: 'Set each surface against the snapshot field by field through the field map, and classify
      every difference: stale, missing, truncated by the platform, rejected, or changed by somebody
      other than this unit. Say since when where the surface carries a modification time. The direction
      is fixed -- the record is the truth and the surface is a copy of it -- so a value that exists
      only on a surface is a divergence to be resolved, never a fact to be copied back inward.'
    produces:
      - divergence_report
  - id: e5-s04-set_the_change_plan
    name: Decide what this run changes, in what order, and what waits for a person
    kind: decide
    description: Decide which divergences this run corrects, in which order across surfaces -- upstream
      sources before the copies they feed -- and which are held for the owner's release under the publication
      policy. Test every intended item against that surface's own content, uniqueness, media and volume
      rules first and hold anything that would breach one, citing the rule. Record what you deliberately
      left alone and why, because an unexplained gap in a cascade reads to the next reviewer as a failure.
    produces:
      - change_plan
  - id: e5-s05-compose_what_each_surface_takes
    name: Compose the payload in the form the surface actually accepts
    kind: draft
    description: 'Compose each change in the form its destination takes: the field names, the length
      and format limits, the media dimensions, the structured-data shape, the language set and the disclosures
      the country pack requires. Capture the value the surface holds now alongside the value replacing
      it, so the change can be reverted rather than argued about. Any figure in a payload comes from
      the published price book and any claim from the source snapshot; nothing is written to fill a
      field that the record cannot support.'
    produces:
      - publication_payload
  - id: e5-s06-publish_through_the_customers_own_account
    name: Push it under the customer's grant, one surface at a time
    kind: act
    description: Publish each released payload from the customer's own connected account and never from
      an account this platform owns, one surface at a time, inside that surface's rate limits and outside
      its quiet periods. Record for every push the surface, the grant used, the payload sent, the response
      returned, the identifier it came back with and the prior value kept for reversion. A push that
      errors stops the surface and is raised; it is never retried blindly into a duplicate.
    produces:
      - publication_log
  - id: e5-s07-read_the_surface_back
    name: Confirm from the surface itself that the change is live
    kind: assess
    description: 'Read every changed surface again after the configured window and record what it actually
      says now: live as intended, still held in the platform''s review, truncated, rejected, or reverted
      by somebody else. A response that said the payload was accepted proves only that it was received.
      Anything not confirmed live goes back onto the divergence report with what the surface returned,
      and stays there until a later read finds it correct.'
    produces:
      - live_verification
  - id: e5-s08-report_the_state_of_every_surface
    name: Give the owner one view of where every surface stands
    kind: notify
    description: 'Report in one place which surfaces now carry the current value, which are waiting
      on a platform review with the date they were submitted, which were rejected and on what stated
      ground, which could not be read at all, and which need the owner''s decision before anything more
      happens. Name the surfaces that could not be verified rather than omitting them: a run that reports
      only its successes cannot be told apart from one that stopped checking.'
    produces:
      - surface_status_report
  - id: e5-s09-fill_every_field_the_platform_offers
    name: Work the platform's own completeness model, not a general idea of one
    kind: gather
    description: Fill every category, attribute, service, hour set, media slot and question the platform
      exposes, each from the source of truth, and record the ones deliberately left empty with the reason.
      Completeness against the platform's own model is what it ranks and what the public reads, and
      a field nobody filled is the field the customer needed.
    produces:
      - profile_completeness_record
  - id: e5-s10-answer_the_public_and_watch_the_edits_you_did_not_make
    name: Hold the profile against everyone else who can change it
    kind: act
    description: 'Publish the scheduled posts, media and service updates from the customer''s own profile,
      answer the questions the public asks on it within the configured window, and watch for the changes
      you did not make: a third-party suggestion the platform accepted, an attribute flipped, a photo
      removed, a duplicate profile appearing. Anything altered underneath you goes back onto the divergence
      report as something to correct, never onto the record as the new truth.'
    produces:
      - public_interaction_log
  - id: e5-s11-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-READ-BACK-PROVES-LIVE
    rule: A change is live when the surface says so on a later read, not when the platform accepted
      the payload.
    check: live_verification carries a post-publication read of every surface named in publication_log,
      taken inside verification_window; anything not confirmed live returns to divergence_report.
    source: mechanism_family
  - id: GR-RECORD-IS-THE-SOURCE
    rule: The business's record is the truth and every surface is a copy of it. A value found only on
      a surface is a divergence, never a fact to be copied back inward.
    check: Every published field resolves to a field of source_of_truth_snapshot with its version; no
      artefact carries a value whose only source is an external surface.
    source: mechanism_family
  - id: GR-GRANT-BEFORE-PUSH
    rule: Every push leaves through the customer's own connected account, and a lapsed or narrowed grant
      stops that surface rather than being passed over in silence.
    check: publication_log names the grant used for each push and it resolves to connected_accounts;
      surface_inventory records each grant's scope and expiry, and a missing one is reported as blocked.
    source: mechanism_family
  - id: GR-PLATFORM-LIMIT-IS-A-STOP
    rule: A push that would breach a surface's own content, uniqueness, media or volume rules is held
      and raised, never attempted. The penalty falls on the profile, not on the item.
    check: change_plan names the platform_rules limit tested for every intended item, and each held
      item cites the rule that held it.
    source: mechanism_family
  - id: GR-REVERSIBLE-BY-DEFAULT
    rule: The value a surface held is captured before it is replaced, so a wrong publication can be
      reverted rather than debated.
    check: publication_log stores the prior value and the reversion route for every changed field, retained
      for the period rollback_policy sets.
    source: mechanism_family
  - id: GR-MACHINE-SURFACES-CARRY-THEIR-FRESHNESS
    rule: Anything a machine reads -- structured data, a declared answer file, an endpoint response
      -- carries the version and date of the record behind it, and any money figure comes from published
      pricing.
    check: Every machine-readable value published names its source record and the time that record was
      read; figures resolve to published_price_book.
    source: mechanism_family
  - id: GR-UNREAD-SURFACE-IS-NOT-A-CORRECT-ONE
    rule: A surface that could not be read is reported as unverified. Silence from a platform is never
      recorded as agreement with the record.
    check: surface_inventory holds a read result for every surface in connected_surfaces, and surface_status_report
      names those that could not be read and what that leaves unproven.
    source: mechanism_family
