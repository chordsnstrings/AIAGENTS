    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: connected_surfaces
    description: 'Every surface this unit writes to: what it is, the customer''s grant it is written
      under with that grant''s scope and expiry, the fields it holds and who else can edit it.'
    resolved_by: owner
    required: true
  - key: surface_field_map
    description: Which canonical field lands in which field of each surface, which fields the surface
      owns rather than the business, and the format and length each one accepts.
    resolved_by: vertical
    required: true
  - key: publication_policy
    description: What may go out on the unit's own authority and what always waits for the owner's release,
      with the volume ceiling, the cadence and the quiet periods for each surface.
    resolved_by: owner
    required: true
  - key: platform_rules
    description: Each surface's own rules in this market on content, uniqueness, media, disclosure and
      volume, and what the unit does when a push would breach one.
    resolved_by: country_pack
    required: true
  - key: verification_window
    description: How long after a push each surface is read back before the change is called live, what
      counts as live there, and how a change still held in the platform's review is reported.
    resolved_by: country_pack
    required: true
  - key: rollback_policy
    description: What prior state is kept for each surface, how long it is kept, and who may order a
      published change reverted.
    resolved_by: owner
    required: true
  - key: profile_field_set
    description: Which categories, attributes and services a profile in this vertical should carry,
      and which are left empty deliberately.
    resolved_by: vertical
    required: true
  - key: posting_calendar
    description: What is posted to the profile, how often, with which media, and the window inside which
      a public question is answered.
    resolved_by: owner
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
kpis:
  - changes confirmed live by a read-back rather than by a platform response
  - surfaces holding the current value at the end of each run
  - publications leaving from the customer's own connected account
  - platform rejections, holds and policy warnings resolved before the next run
  - stale surfaces found by a customer or the owner before the unit found them
  - profile fields complete against the platform's own model
  - scheduled posts and media published on their calendar
  - third-party profile edits caught before a customer hit them
