  - key: completion_rules
    description: What proves a dated obligation was met -- booking reference, receipt, returned confirmation,
      filed certificate -- so nothing is ever closed by time having passed.
    resolved_by: vertical
    required: true
  - key: seasonal_calendar
    description: Dated moments that matter in this market -- seasons, holidays, observances and trading
      peaks -- from the active country pack.
    resolved_by: country_pack
    required: true
  - key: campaign_lead_times
    description: How far ahead of each moment the plan, the assets and the owner's release are needed,
