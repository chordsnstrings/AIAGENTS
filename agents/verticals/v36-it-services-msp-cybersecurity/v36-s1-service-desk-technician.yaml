  - key: exception_signal_sources
    description: Queues, feeds, systems and inboxes this unit watches, with the polling interval and
      the field that carries each item's timestamp.
    resolved_by: owner
    required: true
  - key: triage_rules
    description: 'The deterministic rules that classify an item: the condition each one tests, the category
      it assigns and the rule id it is cited by.'
    resolved_by: vertical
    required: true
  - key: severity_matrix
    description: Severity bands, and for each band the response clock, the recipient and the out-of-hours
      behaviour it demands.
    resolved_by: owner
    required: true
  - key: suppression_rules
    description: The only conditions under which an item may be held back from a human, and the evidence
      each one requires before it applies.
    resolved_by: owner
    required: true
  - key: routing_table
    description: Which desk, role or queue receives each category and severity, the default desk for
      anything unmatched, and the on-call fallback.
    resolved_by: owner
    required: true
  - key: dedupe_window
    description: The key items are collapsed on and the window over which repeats join an existing entry
      rather than opening a new one.
    resolved_by: vertical
  - key: runbook_library
    description: Known conditions that have a fixed runbook, the steps each one runs and the signature
      that identifies a match.
    resolved_by: vertical
    required: true
  - key: dispatch_thresholds
    description: Which fault codes and severities become a work order or a site visit rather than a
      remote step, and the response window each carries.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for IT services, MSP & cybersecurity: intervals, terminology, required
      fields and statutory dates.'
    resolved_by: vertical
    required: true
kpis:
  - share of queue volume closed without reaching a person
  - suppressed items a human later re-opened
  - time from signal to the item being in front of the right person
  - surfaced items breaching their response clock
  - duplicate entries in the surfaced queue
  - items closed by runbook without reaching a person
  - routed items arriving with full context attached
  - repeat alerts on an asset already recorded as fixed
