      anything unmatched, and the on-call fallback.
    resolved_by: owner
    required: true
  - key: dedupe_window
    description: The key items are collapsed on and the window over which repeats join an existing entry
      rather than opening a new one.
    resolved_by: vertical
  - key: rule_book
    description: The regulator, client or house rule set this item is tested against, with its version
      and effective date.
    resolved_by: country_pack
    required: true
  - key: blocking_clauses
    description: Which clauses stop an item outright, which are advisory, and which named role clears
      each kind.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for In-house legal & contracts: intervals, terminology, required
      fields and statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
  - key: payment_rails
    description: Payment rails available in this market.
    resolved_by: country_pack
  - key: published_price_book
    description: The only source of money figures this unit may quote.
    resolved_by: owner
    required: true
kpis:
  - share of queue volume closed without reaching a person
  - suppressed items a human later re-opened
  - time from signal to the item being in front of the right person
  - surfaced items breaching their response clock
  - duplicate entries in the surfaced queue
  - items checked before they left the business
  - flagged clauses carrying a citation and a suggested alternative
  - items released against a flag that a human later reversed
