engine:
  mechanism_family: MF1
  profile: criteria_screen
  config:
    profile: criteria_screen
    profile_summary: Rule-based screening against published criteria -- eligibility, pre-qualification,
      candidate and deal screens -- with a reason per rule.
    state_object: conversation_thread
    recognition_only: false
    revenue_critical: false
flags:
  revenue_critical: false
