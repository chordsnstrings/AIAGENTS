config_keys:
  - key: language_set
    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: watch_sources
    description: 'Every source this unit reads: what it is, how it is reached, the credential or grant
      it is read under, and the field that carries each reading''s own timestamp rather than the time
      you saw it.'
    resolved_by: owner
    required: true
  - key: watch_cadence
    description: How often each source is read, how stale a reading may be before it is refused, and
      what the unit does when a source does not answer.
    resolved_by: vertical
    required: true
  - key: baseline_definition
    description: What each watched value is compared against -- the previous reading, a contracted level,
      a rule in force, a peer band -- and how far back the comparison reaches.
    resolved_by: vertical
    required: true
  - key: materiality_thresholds
    description: The movement at which a difference becomes a finding, per watch, and the persistence
      rule that makes a run of small movements material.
    resolved_by: owner
    required: true
  - key: alert_routing
    description: 'Who receives each watch and at what volume: which findings will not wait for the digest,
      and the out-of-hours contact for those.'
    resolved_by: owner
    required: true
  - key: evidence_retention
    description: What must be captured with every observation and how long the capture is kept, so a
      finding can still be evidenced when a dispute or a statutory clock reaches it.
    resolved_by: country_pack
    required: true
  - key: behaviour_signals
    description: Which behaviours count as decay, absence, unclaimed work or expansion in this vertical,
      and over what window.
    resolved_by: vertical
    required: true
  - key: save_and_offer_policy
    description: What may be offered against each signal, what needs the owner's decision first, and
      how often one record may be contacted.
    resolved_by: owner
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every drafted contact leaves from one
      of these; the platform never reaches a customer from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Regulated professions: intervals, terminology, required fields
      and statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
kpis:
  - material changes surfaced before the owner heard them elsewhere
  - watched sources read on their configured cadence
  - findings carrying a captured source and its timestamp
  - raised findings the recipient marked as noise
  - changes found afterwards that the watch had missed
  - at-risk records contacted before they lapsed
  - drafted contacts released without an edit
  - value recovered from records the sweep re-opened
