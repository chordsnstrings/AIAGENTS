  - key: break_pack
    name: Break pack
    description: 'One break written for a decision: both sides side by side, the delta, the evidence,
      movement since first seen, candidate explanations as observations, the permitted remedy and an
      unfilled decision field.'
    format: bundle
    retained: true
  - key: adjustment_log
    name: Adjustment log
    description: 'Every correction the unit made on its own authority: the entry raised, the break it
