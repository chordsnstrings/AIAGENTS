    retained: true
  - key: counterparty_dispute
    name: Counterparty claim
    description: 'The claim raised with the counterparty: what was expected, what arrived, the evidence
      for the difference, the value claimed and the reference the counterparty assigned it.'
    format: document
    retained: true
  - key: settlement_breaks_worked
    name: Settlement breaks worked
    description: 'Named in the catalogue''s expected output for V47-S6: Settlement breaks worked.'
    format: record
    retained: true
  - key: audit_trail
    name: Audit trail
    description: Every action, gate and message with actor, timestamp and source, retained for the life
      of the record.
    format: log
    retained: true
plan:
  - id: v47-s6-s01-take_both_sides
    name: Take both sides at the same cut-off
    kind: observe
    description: Read each side of the match from its own system of record at the cut-off the cycle
      configures, and capture the control total that source reports for the period before you touch
      anything. Record the system, the extraction time and the range covered for each side. Two sides
      that resolve to the same source are not a reconciliation, and a run that cannot state its control
      totals cannot prove it saw everything.
    produces:
      - reconciliation_run
  - id: v47-s6-s02-normalise_onto_one_shape
    name: Normalise both sides onto one comparable shape
    kind: gather
    description: 'Map both sides onto the common key set -- amount, currency, date, reference, party,
      quantity -- applying only the transformations the configuration names: rounding, currency conversion,
      known timing offsets. Keep the raw value beside every derived one and record the transformation
      that produced it. Anything you had to change to make the two sides comparable is part of the evidence,
      not a private convenience.'
    produces:
      - source_extract
  - id: v47-s6-s03-pair_what_the_rules_pair
    name: Run the match rules in order and cite every pair
    kind: assess
    description: Run the match rules in the order they are written, exact keys before tolerance-based
      ones, and record for every pair the rule id, the keys compared and the residual difference left
      over. One record pairs with one counterpart. Whatever fails to pair, pairs twice or pairs outside
      tolerance is a break -- never a difference absorbed into a rounding line to make the totals agree.
    produces:
      - matched_set
      - break_register
  - id: v47-s6-s04-classify_and_own_each_break
    name: Give every break a category, an owner and a clock
    kind: decide
    description: 'Put each break into a category from the taxonomy and take from that category its owner,
      the remedy the policy already permits and the clock it runs against. Carry forward the breaks
      still open from previous cycles with their original first-seen date, so age is measured from when
      the difference appeared and not from today. A break that matches no category is not thereby resolved:
      it goes to the default owner and stays open.'
    produces:
      - break_register
  - id: v47-s6-s05-write_the_break_pack
    name: Write each break so one read is enough
    kind: draft
    description: 'For each break that needs a person, set the two sides beside each other with the delta,
      the evidence behind both, what has changed since it was first seen, the candidate explanations
      as observations with the evidence for each, the remedy the policy permits and the single decision
      you are asking for. Say what the records show and stop: why the difference happened, whose mistake
      it was and what it should cost belong to the person reading the pack.'
    produces:
      - break_pack
  - id: v47-s6-s06-post_only_what_authority_permits
    name: Post the corrections you are authorised to post
    kind: act
    description: Post each correction the write-back authority already permits, inside its value ceiling,
      as an entry that references the break it closes and the authority clause that allowed it, keeping
      the before and after values. Everything above the ceiling, and everything the authority reserves,
      stays open with its pack queued. A tidy ledger you were not authorised to tidy is worse than an
      untidy one.
    produces:
      - adjustment_log
  - id: v47-s6-s07-report_the_position
    name: Report the closing position and what is still open
    kind: notify
    description: 'Report the cycle: value and count matched, breaks opened, breaks closed with the reference
      that closed each, what remains open by ageing band and the value at risk in each. Reconcile opening
      breaks to closing breaks so the movement is provable. A list reported at zero has to show how
      it got there; a clean cycle is a finding, and it is stated as one.'
    produces:
      - reconciliation_report
  - id: v47-s6-s08-isolate_the_break
    name: Isolate the break and size who it touches
    kind: assess
    description: 'Narrow the break from the total down to the file, batch, line or trade that actually
      carries it, and name every counterparty, merchant or account touched by it with the value each
      one is exposed to. Compare against the counterparty''s own statement rather than your expectation
      of it: the two documents are the reconciliation, and a break stated as a lump sum cannot be chased
      by anybody.'
    produces:
      - break_isolation
  - id: v47-s6-s09-work_the_escalation_ladder
    name: Work the ladder against the settlement clock
    kind: act
    description: Re-run or re-submit whatever the scheme's own rules already permit to be re-submitted,
      then chase the counterparty up the configured ladder with the settlement deadline in front of
      you, logging each rung with the time, the contact and the response. Tell the affected parties
      what is broken and what happens next before they find out from their own statement; silence during
      a settlement break costs more than the break.
    produces:
      - escalation_ladder_log
      - counterparty_dispute
  - id: v47-s6-s10-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-NO-PLUG-FIGURE
    rule: A difference is never absorbed to make two sides agree. Nothing is written to a suspense,
      rounding or balancing line to close a break.
    check: Every entry in adjustment_log names the record it corrects and the write_back_authority clause
      that permitted it; no entry balances to a plug, a suspense account or an unnamed difference.
    source: mechanism_family
  - id: GR-BOTH-SIDES-FROM-SOURCE
    rule: Each side of the match comes from its own system of record at the same cut-off. A ledger is
      never reconciled against a copy of itself.
    check: source_extract names each side's system, extraction time, period and reported control total;
      a run whose sides resolve to one source fails rather than reporting a clean match.
    source: mechanism_family
  - id: GR-MATCH-CITES-A-RULE
    rule: Every pairing names the rule and the tolerance that made it. A match nobody else can reproduce
      is not a match.
    check: Each matched_set row carries a rule id from match_rules, the keys compared and the residual;
      pairs made outside those rules are listed as breaks instead.
    source: mechanism_family
  - id: GR-NO-DOUBLE-COUNT
    rule: One record pairs with one counterpart. The same payment, invoice, shipment or slot is never
      matched or sold twice.
    check: matched_set holds a single pairing per record on each side; a record appearing in two pairings
      raises a break rather than closing both.
    source: mechanism_family
  - id: GR-BREAK-SURVIVES-THE-CYCLE
    rule: A break stays open until it is worked. Re-running the match closes nothing; only a posted
      correction or a human decision does.
    check: Every break_register entry keeps its first-seen date and its age across cycles, and a break
      absent from the current extract is reported as still open rather than dropped.
    source: mechanism_family
  - id: GR-CORRECTION-INSIDE-AUTHORITY
    rule: The unit posts only the corrections write_back_authority already permits, inside its value
      ceiling. Everything else is queued as a brief, however obvious the fix looks.
    check: Each adjustment_log entry cites its authority clause and shows a value under that clause's
      ceiling; anything above it appears in break_pack with an empty decision field.
    source: mechanism_family
  - id: GR-CAUSE-IS-AN-OBSERVATION
    rule: The unit reports what the two sides hold and what differs. It never states why the difference
      happened or attributes fault.
    check: break_pack lists candidate explanations as observations with the evidence for each; where
      a claim is filed it states the contract clause and the computed figure, never a finding about
      a party.
    source: mechanism_family
  - id: GR-ZERO-IS-EVIDENCED
    rule: A list reported at zero is a claim that has to be evidenced. Every closure names what closed
      it.
    check: reconciliation_report reconciles opening breaks to closing breaks -- new, corrected, decided,
      written off -- and each closure carries its adjustment or gate reference.
    source: mechanism_family
