    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: reconciliation_sources
    description: The systems that carry each side of the match, how each one is read, the cut-off it
      is taken at and the control total it reports for the period before any transformation.
    resolved_by: owner
    required: true
  - key: match_rules
    description: 'The ordered rules that pair a record on one side with a record on the other: the keys
      each rule compares, the tolerance it allows and the rule id every pairing is cited by.'
    resolved_by: vertical
    required: true
  - key: break_taxonomy
    description: The categories an unmatched or mismatched item can take, and for each one the owner
      it goes to, the remedy the policy already permits and the clock it runs against.
    resolved_by: owner
    required: true
  - key: tolerance_and_rounding
    description: Differences that may be absorbed without raising a break -- rounding, currency conversion,
      known timing offsets -- and the ceiling above which nothing may be absorbed at all.
    resolved_by: country_pack
    required: true
  - key: reconciliation_cycle
    description: How often the match runs, the period each run covers, the cut-off it takes both sides
      at and the deadline the closing position is due by.
    resolved_by: owner
    required: true
  - key: write_back_authority
    description: Which corrections the unit may post on its own authority, the value ceiling on each,
      and which are reserved for a named person however obvious they look.
    resolved_by: owner
    required: true
  - key: ageing_bands
    description: The age bands open breaks are reported in, and the point in each band at which a break
      escalates rather than continuing to sit.
    resolved_by: owner
  - key: settlement_calendar
    description: Settlement cycles, cut-offs and the deadline each break must be closed by in this market.
    resolved_by: country_pack
    required: true
  - key: counterparty_registry
    description: Counterparties, schemes and platforms settled with, each with its statement format,
      contact route and dispute window.
    resolved_by: owner
    required: true
  - key: escalation_ladder
    description: The rungs a chase climbs per counterparty, the wait at each and the point at which
      it leaves the desk.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Renewables & EV charging (CPOs): intervals, terminology, required
      fields and statutory dates.'
    resolved_by: vertical
    required: true
kpis:
  - share of items matched without a human touch
  - open breaks past their ageing band
  - value left unreconciled at the close of each cycle
  - adjustments posted that a human later reversed
  - cycles whose closing position was reported by its deadline
  - breaks closed inside the settlement window
  - value ageing past the settlement clock
  - affected parties told before they raised it themselves
