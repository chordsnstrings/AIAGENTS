  - key: source_extract
    name: Normalised source extract
    description: Each side mapped onto the common key set, with the raw value kept beside every derived
      one and the transformation that produced it, so any pairing can be reproduced by someone who does
      not trust it.
    format: record
    retained: true
  - key: matched_set
    name: Matched set
    description: 'Every pairing made: the two records, the rule id and tolerance that paired them, the
      keys compared and the residual difference left over.'
    format: record
    retained: true
