    resolved_by: owner
    required: true
  - key: alert_routing
    description: 'Who receives each watch and at what volume: which findings will not wait for the digest,
      and the out-of-hours contact for those.'
    resolved_by: owner
    required: true
  - key: evidence_retention
    description: What must be captured with every observation and how long the capture is kept, so a
      finding can still be evidenced when a dispute or a statutory clock reaches it.
    resolved_by: country_pack
    required: true
  - key: watched_market_sources
    description: The competitors, channels, panels, indices and community surfaces this unit watches,
      with the read cadence for each.
    resolved_by: owner
    required: true
  - key: comparison_basis
    description: 'The terms on which a like-for-like comparison is made in this vertical: inclusions,
      units, term length and tax treatment.'
    resolved_by: vertical
    required: true
  - key: capture_policy
    description: What must be captured with each third-party reading and how long the capture is retained
      for a dispute in this market.
    resolved_by: country_pack
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Logistics & freight (SMB): intervals, terminology, required fields
      and statutory dates.'
    resolved_by: vertical
    required: true
  - key: payment_rails
    description: Payment rails available in this market.
    resolved_by: country_pack
  - key: published_price_book
    description: The only source of money figures this unit may quote.
    resolved_by: owner
    required: true
kpis:
  - material changes surfaced before the owner heard them elsewhere
  - watched sources read on their configured cadence
  - findings carrying a captured source and its timestamp
  - raised findings the recipient marked as noise
  - changes found afterwards that the watch had missed
  - findings carrying a capture of the source they came from
  - comparisons made on a stated like-for-like basis
  - market moves the owner heard about somewhere else first
