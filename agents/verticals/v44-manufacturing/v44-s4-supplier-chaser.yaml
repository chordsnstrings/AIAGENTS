    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: sequence_cadence
    description: 'The ladder for this journey type: how many touches, the interval between each, and
      the channel each one uses.'
    resolved_by: vertical
    required: true
  - key: stop_conditions
    description: What ends a journey early -- reply, conversion, opt-out, complaint, bereavement or
      vulnerability flag -- and which of them also suppress future journeys.
    resolved_by: owner
    required: true
  - key: frequency_caps
    description: Maximum automated touches one contact may receive per window, counted across every
      journey rather than within this one.
    resolved_by: owner
    required: true
  - key: contactable_hours
    description: Hours, days and dates on which an automated touch may be sent in this market, read
      in the recipient's own timezone.
    resolved_by: country_pack
    required: true
  - key: consent_basis
    description: The lawful basis and consent record this market requires before an outbound touch,
      per channel, with the opt-out wording.
    resolved_by: country_pack
    required: true
  - key: suppression_list
    description: Contacts no journey may touch, with the reason and the date the suppression was applied.
    resolved_by: owner
    required: true
  - key: offer_set
    description: The incentives, discounts and rewards this journey may put in writing, with the value
      and expiry of each. The unit picks from this list and never composes a new one.
    resolved_by: owner
    required: true
  - key: commitment_source
    description: The order, baseline or plan that defines what was promised and when.
    resolved_by: owner
    required: true
  - key: chase_escalation
    description: Age bands and the contact level each one escalates to at the counterparty.
    resolved_by: owner
    required: true
  - key: closure_evidence
    description: What proves an item closed, by item type, and who may accept it.
    resolved_by: vertical
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Manufacturing: intervals, terminology, required fields and statutory
      dates.'
    resolved_by: vertical
    required: true
