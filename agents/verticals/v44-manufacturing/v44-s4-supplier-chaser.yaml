      is still open.
    format: record
    retained: true
  - key: otif_chases_logged
    name: OTIF chases logged
    description: 'Named in the catalogue''s expected output for V44-S4: OTIF chases logged.'
    format: record
    retained: true
  - key: audit_trail
    name: Audit trail
    description: Every action, gate and message with actor, timestamp and source, retained for the life
      of the record.
    format: log
    retained: true
plan:
  - id: v44-s4-s01-enrol
    name: Enrol the subject in the journey
    kind: observe
    description: 'Take the trigger event, identify the subject it concerns and open or reuse their journey
      record. Where they are already inside a journey, note which one: two ladders running at the same
      contact is the commonest way a warm list is spent.'
    produces:
      - journey_record
  - id: v44-s4-s02-eligibility
    name: Check they may be contacted at all
    kind: gather
    description: Read the consent record, the suppression list, the opt-out state and the reachable
      channels for this contact, and gather the facts the copy will need. Consent is checked against
      the basis this market requires, per channel, and a missing basis is a stop rather than a risk
      taken.
    produces:
      - consent_state
  - id: v44-s4-s03-cadence
    name: Pick the cadence this subject earns
    kind: assess
    description: 'Place the subject in the segment or band the configuration defines and read off the
      cadence it carries: how many touches, how far apart, on which channel, with which offer attached.
      The cadence comes from configuration, never from how promising this particular contact feels.'
  - id: v44-s4-s04-schedule
    name: Commit the touch plan with its exits
    kind: decide
    description: 'Write the plan down before anything is sent: each touch with its date, channel and
      purpose, the contactable hours it must fall inside, the frequency cap it counts against, and the
      exit conditions that end the journey early. A ladder with no last rung is not a plan.'
    produces:
      - touch_plan
  - id: v44-s4-s05-compose
    name: Draft the next touch
    kind: draft
    description: 'Draft the due touch in the contact''s language: one ask, referring to what actually
      happened to them, with any figure taken from the published price book and any incentive taken
      from the approved offer set. Later touches shorten; they do not get louder.'
  - id: v44-s4-s06-send
    name: Re-check the exits, then send
    kind: act
    description: Immediately before the touch fires, re-read the exit conditions, the suppression list
      and the frequency cap -- state changes between scheduling and sending, and that gap is where the
      unwanted message lives. Then send it from the customer's own connected account inside contactable
      hours and log the delivery.
    produces:
      - touch_log
  - id: v44-s4-s07-close
    name: Close each journey with a named outcome
    kind: notify
    description: Record what came back and close the journey with a named terminal outcome -- converted,
      declined, opted out, unreachable or exhausted -- then report the outcomes to the owner on the
      configured cadence. A journey that simply stops being touched has no outcome and cannot be improved.
    produces:
      - sequence_outcome
  - id: v44-s4-s08-outstanding_list
    name: List what is outstanding, by date
    kind: assess
    description: Compare the commitment -- the purchase order, the patch baseline, the remediation plan
      -- against the current state and list every item still open with the date it was due and how late
      it is.
    produces:
      - outstanding_register
  - id: v44-s4-s09-chase_item
    name: Chase the item, not the relationship
    kind: act
    description: Send each chase naming the specific item, its due date, its age and the evidence that
      would close it, to the contact the counterparty named. Escalate up the configured contact ladder
      as the age bands pass.
    produces:
      - chase_log
  - id: v44-s4-s10-performance_report
    name: Report performance against the commitment
    kind: notify
    description: Report on time and in full against the commitment by counterparty and period, with
      the items still open and their age, so the commercial conversation happens on numbers.
    produces:
      - performance_report
  - id: v44-s4-s11-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-MF5-STOP-ON-RESPONSE
    rule: A reply, a conversion, an opt-out or a complaint ends the journey immediately. Nothing is
      sent after the answer has arrived.
    check: Every touch_log entry carries the exit check that ran immediately before it, with its timestamp;
      a touch sent after an exit condition was met is an error, counted and surfaced, not a near miss.
    source: mechanism_family
  - id: GR-MF5-CONSENT-AT-SEND
    rule: Consent, opt-out and suppression are evaluated at the moment of sending, not at the moment
      of enrolling.
    check: consent_state records the basis, opt-out state and suppression flags as read at send time;
      a touch with no send-time consent record cannot leave the queue.
    source: mechanism_family
  - id: GR-MF5-FINITE-LADDER
    rule: Every journey has a last touch and a named terminal outcome. No ladder runs open-ended, and
      none ends in silence.
    check: touch_plan declares the touch count before the first send, and every closed journey_record
      carries one of the configured terminal outcomes with its reason.
    source: mechanism_family
  - id: GR-MF5-ONE-LADDER-PER-CONTACT
    rule: Frequency caps count across every journey, not within one. A contact already being touched
      is not enrolled again in the same window.
    check: Enrolment queries the contact's open journeys and the cap is applied to the total; the touch
      that would breach it is deferred or dropped with the reason recorded.
    source: mechanism_family
  - id: GR-MF5-OFFERS-FROM-THE-SET
    rule: Incentives, discounts, save offers and rewards come from the approved offer set. The unit
      never composes a new one to close a hesitant contact.
    check: Every incentive in an outbound touch resolves to a row in offer_set with its value and expiry;
      anything outside the set is held at the gate for the owner.
    source: mechanism_family
  - id: GR-MF5-CONTACTABLE-HOURS
    rule: No automated touch is sent outside the contactable hours and dates the active country pack
      defines, read in the recipient's timezone.
    check: Each scheduled touch carries the local send window it was checked against; a touch falling
      outside it is deferred to the next window rather than sent early.
    source: mechanism_family
human_gates:
