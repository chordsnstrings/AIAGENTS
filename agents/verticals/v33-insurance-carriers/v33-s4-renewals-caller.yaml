  - key: consent_basis
    description: The lawful basis and consent record this market requires before an outbound touch,
      per channel, with the opt-out wording.
    resolved_by: country_pack
    required: true
  - key: suppression_list
    description: Contacts no journey may touch, with the reason and the date the suppression was applied.
    resolved_by: owner
    required: true
  - key: offer_set
    description: The incentives, discounts and rewards this journey may put in writing, with the value
      and expiry of each. The unit picks from this list and never composes a new one.
    resolved_by: owner
    required: true
  - key: lapse_definition
    description: How long without activity counts as lapsed for this trade, and how far ahead of a renewal
      date the pre-lapse touch fires.
    resolved_by: vertical
    required: true
  - key: segment_model
    description: Recency, frequency and value bands, and the cadence and offer each band receives.
    resolved_by: owner
    required: true
  - key: attribution_window
    description: How long after a touch a return still counts as reactivated by this journey.
    resolved_by: owner
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Insurance carriers: intervals, terminology, required fields and
      statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
