config_keys:
  - key: language_set
    description: Languages the unit must answer in, from the active country pack.
    resolved_by: country_pack
    required: true
  - key: messaging_channel
    description: Primary messaging rail for this market (WhatsApp, SMS/RCS, LINE, ...).
    resolved_by: country_pack
    required: true
  - key: business_hours
    description: Opening hours and out-of-hours policy for the business.
    resolved_by: owner
  - key: escalation_contacts
    description: Who receives a gate, by role, with an out-of-hours fallback.
    resolved_by: owner
    required: true
  - key: capture_specification
    description: 'The shots this assessment requires before it can be made: the views, angles and stages,
      the scale reference that must appear in frame, minimum resolution and lighting, and whether stills
      or video.'
    resolved_by: vertical
    required: true
  - key: assessment_reference
    description: What the images are read against -- severity scale, checklist, brand standard, planogram,
      parts catalogue, specification or programme line -- with its version and the date it took effect.
    resolved_by: vertical
    required: true
  - key: confidence_thresholds
    description: The confidence at which a finding may be stated as observed, the level below which
      it is carried as undetermined, and the classes of finding that go to a named human whatever the
      confidence.
    resolved_by: owner
    required: true
  - key: media_consent_policy
    description: What consent is needed before an image of a person, a premises or a customer's property
      is stored, re-used or shown in this market, how it is recorded and what withdrawal removes.
    resolved_by: country_pack
    required: true
  - key: media_retention
    description: 'How long originals and derivatives are kept and where, and what must be redacted before
      media leaves the record: faces, plates, documents and third parties caught in frame.'
    resolved_by: country_pack
    required: true
  - key: record_binding_rules
    description: How each item is bound to the job, visit, claim, property, lot or part it belongs to,
      the evidence a binding needs, and what happens to items that bind to nothing.
    resolved_by: owner
    required: true
  - key: severity_scale
    description: 'How damage is graded in this vertical: the bands, what evidence each band requires
      and the wording each band is stated in.'
    resolved_by: vertical
    required: true
  - key: hidden_damage_policy
    description: What must be declared as unassessable from images alone, and the inspection each such
      item is referred to.
    resolved_by: vertical
    required: true
  - key: decision_owner
    description: The licensed or authorised role each class of assessment is handed to, with the out-of-hours
      fallback.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Insurance carriers: intervals, terminology, required fields and
      statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
kpis:
  - findings citing the item, the region and the reference line behind them
  - required views present at first capture
  - assessments accepted without sending somebody back to re-photograph
  - findings the deciding human revised once they saw the subject
  - items bound to the wrong record, or left unbound
  - graded items citing an image, a region and a scale band
  - packs the decider accepted without returning for more photographs
  - gradings the decider revised after seeing the subject
