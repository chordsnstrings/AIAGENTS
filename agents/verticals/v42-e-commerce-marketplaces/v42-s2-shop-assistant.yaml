plan:
  - id: v42-s2-s01-receive
    name: Receive and acknowledge
    kind: observe
    description: Take the inbound event on the channel it arrived on, resolve the contact and thread,
      note the language and the timestamp, and acknowledge inside the configured first-response SLA
      even before you know the answer.
    produces:
      - conversation_transcript
  - id: v42-s2-s02-capture
    name: Capture the structured detail
    kind: gather
    description: Work the intake schema conversationally -- one question at a time, in the contact's
      language, never a form pasted into a chat -- and stop asking the moment the record is complete
      enough to route. Never ask for what the record already holds.
    produces:
      - intake_record
      - contact_record
  - id: v42-s2-s03-triage
    name: Classify intent, urgency and value
    kind: assess
    description: Classify the request against the configured intents and grade urgency against the bands,
      from the facts rather than the tone. Note by name any required field still missing.
    produces:
      - triage_decision
  - id: v42-s2-s04-route
    name: Choose the destination and record why
    kind: decide
    description: Pick the destination from the routing map for this intent and band, or the human gate
      where the request sits outside it, and record the rule that produced the choice so a reviewer
      can see why this went where it went.
    produces:
      - triage_decision
  - id: v42-s2-s05-requirements
    name: Capture the requirement in indexed dimensions
    kind: gather
    description: Take the requirement on the dimensions the catalogue is actually indexed on -- budget,
      level, spec, location, dates, goals -- so the match runs on data rather than on adjectives.
  - id: v42-s2-s06-rank_options
    name: Rank the live catalogue against it
    kind: assess
    description: Score the live catalogue against the requirement and keep the reason each option scored
      where it did, including the ones you dropped and why.
    produces:
      - match_set
  - id: v42-s2-s07-shortlist
    name: Draft the shortlist with its fit and misfit
    kind: draft
    description: Draft a short list of options, each with what fits and what does not. Where nothing
      fits, say so and offer the alternative rather than padding the list to look useful.
    produces:
      - recommendation_note
  - id: v42-s2-s08-send_shortlist
    name: Send it and attach it to the record
    kind: notify
    description: Send the shortlist in the contact's language and attach it to the record so the next
      conversation starts from it.
  - id: v42-s2-s09-record
    name: Record the artefacts
    kind: record
    description: Write every declared artefact to the system of record with its audit trail, then report
      the acceptance result.
    produces:
      - audit_trail
guardrails:
  - id: SR-PROBABILISTIC
    rule: Probabilistic components flag, collect and draft. They never clear, diagnose, advise or approve.
    check: No plan step of kind decide or act may perform a prohibited act without a preceding blocking
      human gate.
    source: standing_rule
  - id: SR-OWNED-CHANNELS
    rule: Growth and social output publishes only from the customer's own connected accounts.
    check: Every publish or send step names a channel held in the customer's OAuth grant; no platform
      account owned by ADW is ever the sender.
    source: standing_rule
  - id: SR-CONFIG-NOT-CODE
    rule: Vertical and country differences resolve to configuration; the unit carries no market-specific
      logic.
    check: Every market-dependent value the unit reads is declared in config_keys and resolved from
      the active country pack.
    source: standing_rule
  - id: SR-AUDIT
    rule: Every artefact the unit produces is retained with its audit trail.
    check: The plan ends in a record step and each declared artefact is written with actor, timestamp
      and source.
    source: standing_rule
  - id: GR-MF1-GROUNDED-ANSWER
    rule: Every checkable statement comes from a named source. Where the source is silent the unit says
      so and offers the handover.
    check: Each answered claim in the reply carries a reference to the Q&A pack, source corpus, price
      book or rule set with its version; a draft containing an unreferenced claim cannot be sent.
    source: mechanism_family
  - id: GR-MF1-URGENCY-FLOOR
    rule: Urgency is assigned by rule. The unit may raise the band the rules produced; it may never
      lower it.
    check: triage_decision records the rule-assigned band alongside the final band; any final band below
      the assigned one is rejected and routed to the named human.
    source: mechanism_family
  - id: GR-MF1-COMPLETE-BEFORE-ROUTE
    rule: A routing decision needs the fields the intake schema marks required. A missing field is a
      question or a gate, never an assumption.
    check: No route step completes while a required intake field is empty; the missing field is named
      in the record and in the handover if one follows.
    source: mechanism_family
  - id: GR-MF1-ONE-THREAD
    rule: One contact, one thread. Channel, language and party switches carry the context with them.
    check: The unit searches every channel for an existing contact before opening a thread; a match
      produces a merge, not a second thread, and the transcript shows the switch.
    source: mechanism_family
  - id: GR-MF1-NO-SILENT-DROP
    rule: Nothing arrives and disappears. Every thread ends in an answer, a booked next action or a
      handover packet.
    check: Threads closed without one of those three carry a logged reason and a named closer; first_response_seconds
      is recorded on every thread and an SLA breach raises an alert rather than a silence.
    source: mechanism_family
human_gates:
