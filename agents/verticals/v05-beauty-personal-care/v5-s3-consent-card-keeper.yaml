    resolved_by: vertical
    required: true
  - key: submission_deadlines
    description: The deadline each pack type must meet, who sets it, how it is counted in this market's
      calendar, and the internal lead time at which an incomplete pack becomes an escalation rather
      than a chase.
    resolved_by: country_pack
    required: true
  - key: document_retention_and_minimisation
    description: What may be disclosed to each acceptor, what must be redacted or withheld before a
      pack leaves, the lawful basis for holding each item, and how long it is retained after the pack
      closes.
    resolved_by: owner
    required: true
  - key: consent_forms
    description: The permission wording required for each activity in this market, its version history,
      its validity period and who is competent to give it, including minors and third parties.
    resolved_by: country_pack
    required: true
  - key: activity_prerequisites
    description: What must be on file before each activity may proceed -- consent, test, proof, record,
      induction -- and who is told when it is not.
    resolved_by: vertical
    required: true
  - key: connected_accounts
    description: OAuth grants for the customer's own accounts. Every publish and every send leaves from
      one of these; the platform never posts from an account it owns.
    resolved_by: owner
    required: true
  - key: vertical_overlay
    description: 'Vertical overlay for Beauty & personal care: intervals, terminology, required fields
      and statutory dates.'
    resolved_by: vertical
    required: true
  - key: regulator_guardrails
    description: Advertising, claims and advice rules for this market's regulator, from the active country
      pack.
    resolved_by: country_pack
    required: true
kpis:
  - packs complete and filed before their deadline
  - items already on file that were requested from the holder again
  - items rejected by the acceptor after submission
  - expired or superseded items caught before the pack was filed
  - open gaps carrying a named holder and a days-remaining count
  - activities that went ahead with a valid permission already on file
  - permissions captured before rather than after the activity
