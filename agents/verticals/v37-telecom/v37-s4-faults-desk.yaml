    retained: true
  - key: triage_decision
    name: Triage decision
    description: Intent, urgency band, value band, destination and the rule that assigned each one.
    format: record
    retained: true
  - key: severity_grade
    name: Severity grade
    description: Assigned band, the rule and vulnerability flags that assigned it, and the response
